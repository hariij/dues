<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f4f0">
<title>Dues Planner</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f4f0;--surface:#fcfcfb;--raise:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#77766f;--line:#e3e2dc;--grid:#ecebe6;--hover:#f1f0eb;
  --k1:#2a78d6;--k2:#1baf7a;--k3:#eb6834;--k4:#4a3aa7;--k5:#eda100;--k6:#e87ba4;--k7:#008300;
  --good:#0ca30c;--warn:#fab219;--warn-ink:#8a5a00;--crit:#d03b3b;--crit-bg:#fbeaea;--warn-bg:#fdf3dc;--good-bg:#e6f5e6;
  --accent:#2a78d6;--accent-ink:#fff;--soon-ink:#b86200;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211;--surface:#1a1a19;--raise:#222220;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#9a998f;--line:#2f2f2c;--grid:#282826;--hover:#252523;
    --k1:#3987e5;--k2:#199e70;--k3:#d95926;--k4:#9085e9;--k5:#c98500;--k6:#d55181;--k7:#008300;
    --warn-ink:#fab219;--crit-bg:#3a1f1f;--warn-bg:#3a3018;--good-bg:#1d331d;--accent:#3987e5;--soon-ink:#f0a04b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--raise:#222220;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#9a998f;--line:#2f2f2c;--grid:#282826;--hover:#252523;
  --k1:#3987e5;--k2:#199e70;--k3:#d95926;--k4:#9085e9;--k5:#c98500;--k6:#d55181;--k7:#008300;
  --warn-ink:#fab219;--crit-bg:#3a1f1f;--warn-bg:#3a3018;--good-bg:#1d331d;--accent:#3987e5;--soon-ink:#f0a04b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.num,.amt,td.n,th.n{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.month button:hover{background:var(--hover)}
.month button:disabled{opacity:.25;cursor:default;background:none}
.month span{min-width:128px;text-align:center;font-weight:650;font-size:14px}
.nav{max-width:1080px;margin:0 auto;padding:0 10px;display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:10px 12px 11px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent}
.nav a[aria-current=page]{color:var(--ink);border-color:var(--ink)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none}
main{max-width:1080px;margin:0 auto;padding:16px 16px 40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--crit)}
.btn.wide{width:100%}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px}
.icon-btn:hover{background:var(--hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:none}

/* layout pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack>*+*{margin-top:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec-h h2{font-size:15.5px;font-weight:700}
.sec-h .seg{flex-wrap:nowrap;flex:none}
.sec-h .sub{font-size:13px;color:var(--ink2)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-h h2{font-size:15.5px;font-weight:700}
.note{font-size:12.5px;color:var(--ink2);margin:4px 0 0}

/* status banner */
.banner{display:flex;gap:12px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.banner .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--good)}
.banner.bad{background:var(--crit-bg);border-color:transparent}
.banner.bad .ic{background:var(--crit)}
.banner.warn{background:var(--warn-bg);border-color:transparent}
.banner.warn .ic{background:var(--warn);color:#000}
.banner>div:last-child{min-width:0;flex:1}
.banner b.h{display:block;font-size:16px;margin-bottom:2px}
.banner p{margin:3px 0 0;font-size:14px}
.banner .steps{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.banner .steps li{display:flex;gap:8px;justify-content:space-between;padding:3px 0;border-top:1px dashed color-mix(in srgb,var(--ink2) 30%,transparent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.kpi .s .i{font-weight:800}
.kpi.bad .v{color:var(--crit)}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--c,var(--ink2))}

/* week strip */
.week .wk-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline;margin-bottom:4px}
.week .wk-h h2{font-size:15.5px}

/* category cards */
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cat{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.cat:hover{background:var(--hover)}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.cat .t{display:flex;justify-content:space-between;font-weight:650;font-size:14px}
.cat .big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.cat .big small{font-size:13px;font-weight:500;color:var(--ink2)}
.cat .m{font-size:12.5px;color:var(--ink2);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* rows */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:50px 1fr auto 76px;gap:4px 12px;align-items:center;padding:10px 14px 10px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.hot::before,.row.soon::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--crit)}
.row.soon::before{background:var(--warn)}
.row.hot{background:color-mix(in srgb,var(--crit-bg) 70%,transparent)}
.dt{text-align:center;line-height:1.05;border-radius:10px;padding:5px 0;background:var(--hover)}
.dt b{display:block;font-size:17px;font-weight:700}
.dt span{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:600}
.dt.nd b{font-size:11px;font-weight:600;color:var(--ink2);text-transform:none;letter-spacing:0;padding:3px 0}
.nm{min-width:0}
.nm .a{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm .b{font-size:12.5px;color:var(--ink2)}
.tag{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink2);background:var(--surface)}
.est{font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;color:var(--ink2);border:1px dashed var(--ink3);margin-right:4px;vertical-align:1px}
.rt{text-align:right;min-width:0}
.rt .amt{font-weight:700;white-space:nowrap}
.rt .sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;white-space:nowrap}
.flag.crit{color:var(--crit)}
.flag.warn{color:var(--warn-ink)}
.flag.warn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.flag.good{color:var(--good)}
.row.paid .nm .a,.row.paid .amt{color:var(--ink2)}
.row .act{display:flex;justify-content:flex-end}
.okmark{color:var(--good);font-weight:700;font-size:13px}

/* dues groups */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--hover);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.seg label{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center}
.seg button[aria-pressed=true],.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;pointer-events:none;margin:0}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.grp-h{display:grid;grid-template-columns:auto 1fr auto 20px;gap:4px 10px;align-items:center;width:100%;padding:14px 14px 8px;background:none;border:0;text-align:left;cursor:pointer}
.grp-h .gn{font-weight:700;font-size:15.5px}
.grp-h .gm{grid-column:2/3;font-size:12.5px;color:var(--ink2)}
.grp-h .ga{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.grp-h .ga small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.grp-h .chev{transition:transform .15s;color:var(--ink2)}
.grp[data-open=false] .chev{transform:rotate(-90deg)}
.grp[data-open=false] .gbody{display:none}
.grp .meter{margin:0 14px 12px}
.gfoot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.gfoot .nd{display:flex;flex-direction:column;gap:2px}
.addin{border:1px dashed var(--ink3);background:none;border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.addin:hover{color:var(--ink);border-color:var(--ink2)}
.dategrp-h{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--bg)}
.empty{padding:18px 14px;color:var(--ink2);font-size:14px}

/* money */
.mrow{display:grid;grid-template-columns:50px 1fr auto auto;gap:4px 12px;align-items:center;padding:11px 14px 11px 12px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow input.bal[type=number]{width:140px;text-align:right;font-weight:700}
.mrow.done{opacity:.7}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ico{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--hover);font-size:18px}
.buffer{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.buffer input.num[type=number]{width:150px;text-align:right;font-weight:700}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin:6px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:18px;height:0;border-top:2px solid var(--c)}
.legend .ln.dash{border-top-style:dashed}
.ax{fill:var(--ink2);font-size:11px}
.gl{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.16);border-radius:10px;padding:8px 10px;font-size:12.5px;z-index:5;min-width:170px;max-width:290px;display:none}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip b{font-variant-numeric:tabular-nums}
.tip .hd{font-weight:700;margin-bottom:3px}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:650}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-bottom:0}

.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr;gap:14px}

/* dialog */
dialog{border:0;padding:0;border-radius:18px;width:min(500px,calc(100vw - 24px));max-height:min(88vh,860px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;max-height:inherit}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.dh h3{font-size:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.x{border:0;background:var(--hover);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.db{padding:4px 18px 14px;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.db h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:18px 0 6px}
.fld{display:flex;flex-direction:column;gap:5px;margin:12px 0 0}
.fld>span{font-size:13px;font-weight:650;color:var(--ink2)}
.fld small{font-size:12px;color:var(--ink3);line-height:1.4}
input:not([type=checkbox]):not([type=radio]),select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:42px}
input[type=number]{font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;flex:none}
.quick{display:flex;gap:6px;margin-top:6px}
.tiles{display:grid;gap:8px}
.tile{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.tile:hover{background:var(--hover);border-color:var(--ink3)}
.tile .ico{grid-row:1/3}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--ink2)}
.sumbox{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;background:var(--hover);border-radius:12px;padding:12px 14px;margin:10px 0}
.sumbox .big{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pays{list-style:none;padding:0;margin:0}
.pays li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12.5px;color:var(--ink2);background:var(--hover);border-radius:10px;padding:8px 11px;margin:12px 0 0}
.pickcards{display:grid;gap:6px}
.pickcards button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.pickcards button:hover{background:var(--hover)}
[hidden]{display:none!important}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink2);vertical-align:2px;margin-left:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.sync.ok::before{background:var(--good)}.sync.warn::before{background:var(--warn)}.sync.bad{color:var(--crit)}.sync.bad::before{background:var(--crit)}
body.gated .nav,body.gated main,body.gated .fab,body.gated .top .month,body.gated #addTop{display:none!important}
#gate{max-width:440px;margin:0 auto;padding:40px 16px}
body:not(.gated) #gate{display:none}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:10px}
.gate-card h2{font-size:18px}
.row{padding:9px 14px 9px 12px;grid-template-columns:46px minmax(0,1fr) auto 70px}
.row .nm .a .t{overflow:hidden;text-overflow:ellipsis}
.row .nm .b{display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.row .dot{color:var(--ink3)}
.dt{padding:4px 0}.dt b{font-size:16px}
.est{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;color:var(--ink2);border:1px dashed var(--ink3)}
.banner p.big1{font-size:20px;font-weight:700;margin:4px 0 0}
.banner p.next{margin-top:10px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--ink2) 30%,transparent)}
.banner .lbl{margin:10px 0 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.ready{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:2px 0 0;font-size:14.5px}
.ready .sep{color:var(--ink3)}
.warnline{margin-top:10px!important;font-size:13.5px;color:var(--crit)}
details.more{margin-top:8px}details.more>summary,details.paidfold>summary,details.paidlist>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;list-style:none}
details.more>summary::-webkit-details-marker,details.paidfold>summary::-webkit-details-marker,details.paidlist>summary::-webkit-details-marker,details.todo-g>summary::-webkit-details-marker{display:none}
details.paidfold>summary{padding:10px 14px;border-top:1px solid var(--line);color:var(--ink2)}
details.paidfold[open]>summary{color:var(--ink)}
details.paidlist>summary{padding:12px 14px;border-top:1px solid var(--line)}
.todos{padding:0;overflow:hidden}
.todo{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.todo:hover{background:var(--hover)}
.todo .when{color:var(--ink2);font-size:13.5px}
.todo .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.todo.money{background:color-mix(in srgb,var(--good-bg) 60%,transparent)}
.todo.stm .when{color:var(--ink2)}
details.todo-g{border-bottom:1px solid var(--line)}details.todo-g>summary{list-style:none;border-bottom:0}
details.todo-g .chev{color:var(--ink2);transition:transform .15s;width:62px;text-align:center}details.todo-g[open] .chev{transform:rotate(180deg)}
details.todo-g .list{border-top:1px dashed var(--line);background:var(--bg)}
.todos>.empty{border-bottom:1px solid var(--line)}
.cnt{padding:6px 14px 12px}

    groups.sort((a,b)=>a.k==='late'?-1:b.k==='late'?1:a.k==='any'?1:b.k==='any'?-1:a.k<b.k?-1:1);
    sub=xs.length?`${money(sum(xs,x=>x.rem))} to pay · ${xs.length} bill${xs.length===1?'':'s'}`:'';
    body=groups.map(g=>{
      const d=g.k==='late'?addDays(TODAY,-1):g.k==='any'?null:g.k,L=g.k==='late'?{t:'Overdue',s:`${g.xs.length} bill${g.xs.length===1?'':'s'} past the date`}:dayLabel(d);
      return `<div class="tday ${g.k==='late'?'u-late':urg(d)}"><div class="tday-h"><span class="dl"><b>${L.t}</b>${L.s?` <span>${L.s}</span>`:''}</span><span class="dt2">${g.xs.length>1?`${g.xs.length} bills · `:''}<b>${money(sum(g.xs,x=>x.rem))}</b>${g.xs.length>1&&g.k!=='any'?` <button class="btn sm ghost payall" data-act="payAll" data-k="${g.k}">Pay all</button>`:''}</span></div>${g.xs.map(trow).join('')}</div>`}).join('');
    // statements to enter in this range
    const st=[];for(let m=CUR;m<=addMonths(CUR,2);m=addMonths(m,1))monthList(m).forEach(x=>{if(x.k==='card'&&x.it.mode!=='used'&&!x.confirmed&&x.rem>0&&x.due&&x.due>=R[0]&&x.due<=addDays(R[1],5))st.push(x)});
    if(st.length)body+=`<div class="tday u-info"><div class="tday-h"><span class="dl"><b>Card statements to enter</b> <span>amounts above are estimates until you do</span></span>${st.length>1?'<button class="btn sm ghost" data-act="stmts">Enter all</button>':''}</div>${st.sort(byDue).map(x=>`<div class="trow" data-act="open" data-id="${x.it.id}" data-m="${x.m}" role="button" tabindex="0"><span class="sw" style="--c:${col(catOf(x.it.cat))}"></span><span class="tn">${esc(x.it.name)} <small>due ${fd(x.due)} · estimate ${money(x.amount)}</small></span><span></span><button class="btn sm" data-act="open" data-id="${x.it.id}" data-m="${x.m}">Enter</button></div>`).join('')}</div>`;
    if(!xs.length){const nx=[];for(let m=CUR;m<=addMonths(VM,2);m=addMonths(m,1))monthList(m).forEach(x=>{if(x.rem>0&&x.due&&x.due>R[1])nx.push(x)});nx.sort(byDue);
      body=`<div class="empty">Nothing to pay ${mode==='week'?'this week':mode==='next'?'next week':'for the rest of the month'}.${nx[0]?` Next: <b style="color:var(--ink)">${esc(nx[0].it.name)}</b> ${money(nx[0].rem)} by ${fdw(nx[0].due)}.`:''}</div>`+body}
  }
  const legend=mode==='paid'?'':`<div class="ulegend"><span class="u-late">Overdue</span><span class="u-now">Today or tomorrow</span><span class="u-soon">In 2 to 3 days</span><span class="u-week">This week</span><span class="u-later">Later</span></div>`;
  return `<div class="sec-h todo-h"><h2>To do</h2>${tabs}</div><div class="card todos">${sub?`<div class="tsum">${sub}</div>`:''}${body}${legend}</div>`;
}

function monthProgress(s){
  const pct=s.due?s.paid/s.due*100:0;

    <div class="prog-h"><b>${money(s.paid)}</b> of ${money(s.due)} paid<span class="muted"> · ${money(s.left)} left</span></div><div class="meter" style="--c:var(--good);margin:6px 0 10px"><i style="width:${pct}%"></i></div>`;
  S.cats.forEach(c=>{
    const L=s.L.filter(x=>x.it.cat===c.id);if(!L.length)return;
    const due=sum(L,x=>x.amount),paid=sum(L,x=>Math.min(x.paid,x.amount)),left=sum(L,x=>x.rem),np=L.filter(x=>x.rem<=0).length;
    h+=`<a class="pr" href="#/dues/${c.id}" style="--c:${col(c)}"><span class="pn"><span class="sw"></span>${esc(c.name)}</span><span class="meter"><i style="width:${due?paid/due*100:0}%"></i></span><span class="pc">${np} of ${L.length} paid</span><span class="pl">${left>0?money(left)+' left':'<span class="okmark">✓ Done</span>'}</span></a>`;
  });
  return h+'</div>';
}

/* ---------- MONEY ---------- */
function incDate(f){
  if(f.type==='monthly'){const st=f.from&&f.from>CUR?f.from:CUR;for(let k=0;k<24;k++){const m=addMonths(st,k);if(!(f.rec&&f.rec[m]))return{m,d:`${m}-${pad(Math.min(f.day||1,daysIn(m)))}`}}return null}
  return{m:monthOf(f.date||TODAY),d:f.date||TODAY};
}

     <label class="balbox"><span class="small muted">Balance</span><input class="bal num" type="number" inputmode="decimal" step="0.01" data-bal="${a.id}" value="${a.balance}" aria-label="${esc(a.name)} balance"${b<0?' style="color:var(--crit)"':''}></label></div>`}).join('')

  h+=pend.length?pend.map(({f,n})=>{

      `into ${esc((acct(f.account)||{}).name||'no account')}`, f.sure?'counting on it':'<b>not sure</b>'].filter(Boolean).join(' · ');

/* ---------- PLAN ---------- */
function loanRows(){
  return S.items.filter(it=>kindOf(it)==='loan'&&(!it.until||it.until>=VM)&&(!it.from||it.from<=addMonths(VM,24))).map(it=>{
    const x=occursIn(it,VM)?inst(it,VM):null;
    const after=it.until?Math.max(0,mIdx(it.until)-mIdx(VM)):0;
    const left=it.until?after+(x?(x.rem>0?1:0):1):null;
    const remAmt=it.until?r2(after*it.amount+(x?x.rem:it.amount)):null;
    return{it,day:(it.rule||{}).day||0,left,remAmt,x};
  });
}
function rPlan(){
  const ctx=planCtx();
  let h=cashPlanHTML(ctx)+`<div class="card"><div class="card-h"><h2>Next 12 months</h2>${tblToggle('outlook')}</div>

      ${nx?`<div class="kpi"><div class="l">Next to finish</div><div class="v" style="font-size:18px">${esc(sameEnd.map(l=>l.it.name).join(', '))}</div><div class="s">Last EMI ${fm(nx.it.until)} · frees ${money(sum(sameEnd,l=>l.it.amount))}/month</div></div>`:''}
      ${quick.length?`<div class="kpi"><div class="l">Quickest relief if prepaid</div><div class="v" style="font-size:15px;white-space:normal;line-height:1.35">${quick.map(l=>`${esc(l.it.name)} <span class="muted small">${l.left} left</span>`).join('<br>')}</div><div class="s">Fewest EMIs left frees the most per rupee. Ask the lender for the exact closure amount.</div></div>`:''}
    </div>
    <div class="card"><div class="card-h"><h2>Loan timeline</h2>${tblToggle('gantt')}</div><p class="note" style="margin:0 0 6px">Faded part is already paid. Each bar ends at the last EMI.</p><div class="chart" id="gantt"></div></div>
    <div class="card" style="margin-top:14px"><div class="card-h"><h2>All loans</h2><div class="seg">${[['due','Due day'],['end','Ends first'],['emi','Biggest EMI'],['left','Fewest left']].map(([k,l])=>`<button data-act="lsort" data-k="${k}" aria-pressed="${U.loanSort===k}">${l}</button>`).join('')}</div></div>
    <div class="scroll" id="loanTbl"></div></div>`;
  }
  // history
  const ms=[];for(let m=S.startMonth;m<=(CUR>S.startMonth?CUR:S.startMonth);m=addMonths(m,1))ms.push(m);
  h+=`<div class="sec-h"><h2>Month by month</h2></div><div class="card scroll"><table><thead><tr><th>Month</th><th class="n">Due</th><th class="n">Paid</th><th class="n">Not paid</th></tr></thead><tbody>${ms.reverse().map(m=>{const s=summary(m);return `<tr><td>${fmL(m)}</td><td class="n">${money(s.due)}</td><td class="n">${money(s.paid)}</td><td class="n">${money(s.left)}</td></tr>`}).join('')}</tbody></table></div>`;
  view.innerHTML=h;
  if(ctx.sc)drawRunway(ctx.sc,scenario(VM,()=>false),ctx.B.en);
  drawOutlook();
  if(LR.length){drawGantt(LR);loanTable(LR)}
}
function loanTable(LR){

function niceTicks(min,max,n){
  const span=(max-min)||1,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st,o=[];
  for(let v=a;v<=b+st/2;v+=st)o.push(Math.round(v));return o;
}

    const hr=host.getBoundingClientRect();
    let left=e.clientX-hr.left+14;if(left+tip.offsetWidth>hr.width)left=e.clientX-hr.left-tip.offsetWidth-14;
    let top=e.clientY-hr.top-tip.offsetHeight-12;if(top<0)top=e.clientY-hr.top+18;

}

const fld=(label,inner,help)=>{const t=inner.includes('class="seg"')||inner.includes('class="quick"')?'div':'label';return `<${t} class="fld"><span>${label}</span>${inner}${help?`<small>${help}</small>`:''}</${t}>`};

function wireShow(f){ // data-show="name=a|b" or "name!=a"
  const sync=()=>f.querySelectorAll('[data-show]').forEach(el=>{
    const m=el.dataset.show.match(/^(\w+)(!?=)(.*)$/);const v=(f.elements[m[1]]||{}).value;const hit=m[3].split('|').includes(v);

  const def=already?null:(x.o.lastAcc&&acct(x.o.lastAcc))||S.accounts.find(a=>(+a.balance||0)>=x.rem)||S.accounts[0];

/* ============ round 1: runway strip, check-in, pay all, statements, manage ============ */
function runwayStrip(ctx){
  const {sc,B,showNext,preEnd,pf}=ctx;if(!sc)return '';
  const end=showNext?B.en:preEnd,days=sc.days.filter(d=>d.d<=end);if(days.length<2)return '';
  const buf=sc.buf,cls=d=>d.bal<buf&&d.d>=B.st?'s-need':d.bal<0?'s-bad':d.bal<buf?'s-warn':'s-ok';
  const bad=days.find(d=>d.bal<buf),n=days.length,pct=i=>(i/(n-1))*100;
  const head=!bad?`<b>Covered until ${fdw(end)}</b>${showNext?'':` <span class="muted">next month's bills show here from ${fd(pf)}</span>`}`:bad.d>=B.st&&bad.d>TODAY?`<b>Covered until ${fdw(addDays(bad.d,-1))}</b> <span class="muted">then next month's bills need ${N$(sc.bundleNeed)} more</span>`
    :`<b class="neg">Short from ${fdw(bad.d)}</b> <span class="muted">by ${N$(buf-bad.bal)} that day</span>`;
  let months='';days.forEach((d,i)=>{if(i===0||d.d.slice(8)==='01')months+=`<span style="left:${pct(i)}%">${esc(parse(d.d).toLocaleDateString('en-IN',{month:'short'}))}</span>`});
  let marks='';days.forEach((d,i)=>{const inn=sum(d.ev.filter(e=>e.a>0),e=>e.a),out=-sum(d.ev.filter(e=>e.a<0),e=>e.a);
    if(inn>=50000)marks+=`<span class="mk in" style="left:${pct(i)}%" title="${esc(fd(d.d))}: +${money(inn)}">▲</span>`;
    else if(out>=50000)marks+=`<span class="mk out" style="left:${pct(i)}%" title="${esc(fd(d.d))}: −${money(out)}">▼</span>`});
  const bi=days.findIndex(d=>d.d===B.st);
  return `<div class="card rstrip"><div class="rs-h"><span>${head}</span><span class="muted small">today to ${fd(end)}</span></div>
    <div class="rs-months">${months}</div>
    <div class="rs-bar" role="group" aria-label="Balance by day">${days.map(d=>`<button class="rs-d ${cls(d)}${d.d===TODAY?' today':''}" data-act="rsDay" data-d="${d.d}" aria-label="${esc(fd(d.d))}, balance ${esc(money(d.bal))}"></button>`).join('')}${bi>0?`<span class="rs-cut" style="left:${pct(bi)}%" title="Next month's bills start"></span>`:''}</div>
    <div class="rs-marks">${marks}</div>
    <div class="rs-info" id="rsInfo">Tap a day to see your balance and what happens that day. <span class="rs-leg"><span><i class="s-ok"></i>covered</span>${buf>0?'<span><i class="s-warn"></i>below buffer</span>':''}<span><i class="s-bad"></i>short</span>${showNext?`<span><i class="s-need"></i>needs the money you arrange</span>`:''}<span><b class="in">▲</b> money in</span><span>▼ big bill</span></span></div></div>`;
}
function rsDayInfo(d){
  const sc=planCtx().sc;if(!sc)return;const day=sc.days.find(x=>x.d===d);if(!day)return;
  $$('.rs-d.sel').forEach(e=>e.classList.remove('sel'));const b=$(`.rs-d[data-d="${d}"]`);if(b)b.classList.add('sel');
  $('#rsInfo').innerHTML=`<b>${fdw(d)}</b> · balance after: <b class="${day.bal<0?'neg':''}">${money(day.bal)}</b>${day.ev.length?`<ul class="rs-ev">${day.ev.map(e=>`<li><span>${esc(nmOf(e))}</span><span>${e.a>0?'+':'−'}${money(Math.abs(e.a))}</span></li>`).join('')}</ul>`:' · nothing happens this day'}`;
}

/* ---- card statements ---- */
function stmtList(){
  const B=bundleOf(VM<CUR?CUR:VM),out=[];
  for(let m=CUR;m<=addMonths(CUR,2);m=addMonths(m,1))monthList(m).forEach(x=>{if(x.k==='card'&&x.it.mode!=='used'&&x.rem>0&&x.due&&x.due>=addDays(TODAY,-5)&&x.due<=B.en)out.push({x,it:x.it,m,due:x.due})});
  S.items.filter(it=>kindOf(it)==='card'&&it.mode==='used').forEach(it=>{
    for(let m=CUR;m<=addMonths(CUR,2);m=addMonths(m,1)){const d=(ov(m,it.id)||{}).due||ruleDate(it,m);if(d&&d>=TODAY){out.push({it,m,due:d,used:1,x:occursIn(it,m)?inst(it,m):null});break}}
  });
  return out.sort((a,b)=>a.due<b.due?-1:1);
}
function stmtBody(L){

  return `<p class="muted" style="margin-top:0">Type the amount from each statement. Leave a box empty to keep the estimate${L.some(l=>l.used)?', or to say a borrowed card was not used':''}.</p>`+
   L.map((l,i)=>{const own=l.it.owner&&l.it.owner!=='Me'?` <span class="tag">${esc(l.it.owner)}</span>`:'';
     const cur=l.x?(l.x.confirmed?l.x.amount:''):'';
     const ph=l.used?(l.x?'':'not used'):`estimate ${short(l.x.amount)}`;
     return `<div class="stm-r"><div><b>${esc(l.it.name)}</b>${own}<small>due ${fdw(l.due)}${l.x&&!l.x.confirmed?` · estimate ${money(l.x.amount)}`:''}${l.x&&l.x.confirmed?' · entered':''}</small></div>
       <input type="number" inputmode="decimal" step="0.01" min="0" name="st_${i}" value="${cur}" placeholder="${ph}" aria-label="${esc(l.it.name)} statement amount"></div>`}).join('');
}
function stmtSave(L,fdata){
  let n=0;L.forEach((l,i)=>{const v=String(fdata.get('st_'+i)||'').trim();if(v==='')return;const a=num(v);
    const o=ov(l.m,l.it.id,true);if(l.used){if(a>0){o.on=true;o.amount=a;o.confirmed=true;if(l.due!==ruleDate(l.it,l.m))o.due=l.due;n++}}
    else{o.amount=a;o.confirmed=true;n++}});

/* ---- pay all for a day ---- */
function dayItems(key){
  const xs=[];for(let m=S.startMonth;m<=addMonths(CUR,2);m=addMonths(m,1))monthList(m).forEach(x=>{if(x.rem<=0)return;
    if(key==='late'){if((x.due&&x.due<TODAY)||(!x.due&&m<CUR))xs.push(x)}else if(x.due===key)xs.push(x)});
  return xs.sort((a,b)=>b.rem-a.rem);
}
function openPayAll(key){
  const xs=dayItems(key);if(!xs.length)return;const j0=snap(),tot=sum(xs,x=>x.rem);
  const def=S.accounts.find(a=>(+a.balance||0)>=tot)||S.accounts[0];
  let b=`<p class="muted" style="margin-top:0">${key==='late'?'Overdue bills':`Bills due ${fdw(key)}`}. Untick any you are not paying now.</p>`;
  b+=xs.map((x,i)=>`<label class="chk pa"><input type="checkbox" name="pa_${i}" data-a="${x.rem}" checked><span><b>${esc(x.it.name)}</b>${x.it.owner&&x.it.owner!=='Me'?` <span class="tag">${esc(x.it.owner)}</span>`:''} ${money(x.rem)}${!x.confirmed?' <span class="est">Estimate</span>':''}</span></label>`).join('');
  b+=`<div class="g2">${fld('Date',`<input type="date" name="date" value="${TODAY}" required>`)}${fld('Paid from',`<select name="acc">${S.accounts.map(a=>`<option value="${a.id}" ${def&&a.id===def.id?'selected':''}>${esc(a.name)} (${money(a.balance)})</option>`).join('')}<option value="">Somewhere else, or already in my balance</option></select>`)}</div><p class="hint" id="paHint"></p>`;
  const f=openDlg(`Pay ${xs.length} bills`,b,`<button type="button" class="btn" data-close>Cancel</button><button class="btn primary" id="paBtn">Pay ${money(tot)}</button>`,fdata=>{
    const acc=fdata.get('acc')||'',date=fdata.get('date');let t=0,n=0;
    xs.forEach((x,i)=>{if(!fdata.get('pa_'+i))return;const o=ov(x.m,x.it.id,true);o.pays=o.pays||[];o.pays.push({id:uid(),date,amount:x.rem,acc,note:'Paid with other bills',at:Date.now()});
      if(x.k!=='loan'&&!x.confirmed){o.amount=r2(x.paid+x.rem);o.confirmed=true}if(x.it.mode==='used')o.on=true;t+=x.rem;n++});
    if(!n)return false;const a=acct(acc);if(a)a.balance=r2((+a.balance||0)-t);
    setTimeout(()=>toast(`${n} bills paid, ${money(t)}${a?' from '+esc(a.name):''}`,()=>restore(j0)),0);
  });
  const upd=()=>{const t=sum([...f.querySelectorAll('input[type=checkbox]:checked')],c=>+c.dataset.a),a=acct(f.acc.value);$('#paBtn').textContent=`Pay ${money(t)}`;
    $('#paHint').className='hint'+(a&&(+a.balance||0)-t<0?' warn':'');$('#paHint').innerHTML=a?`${esc(a.name)}: ${money(a.balance)} → <b>${money(r2((+a.balance||0)-t))}</b> after this.`:'Your balances will not change.'};
  f.addEventListener('change',upd);upd();
}

/* ---- month-end check-in ---- */
function checkinState(){
  const c=((S.checkin||{})[VM])||{};
  const balOk=S.accounts.length>0&&S.accounts.every(a=>a.updated&&a.updated>=addDays(TODAY,-1));
  const L=stmtList(),cardsOk=L.every(l=>l.used?!!c.cards:(l.x&&l.x.confirmed))||(!!c.cards&&c.cards>=addDays(TODAY,-3));
  const moneyOk=!!c.money&&c.money>=addDays(TODAY,-3);
  return{balOk,cardsOk,moneyOk,c};
}
function checkinCard(ctx){
  if(!ctx.sc||(ctx.early&&!U.showNext))return '';
  const s=checkinState(),steps=[['Update bank balances',s.balOk],['Enter card statements',s.cardsOk],['Confirm money coming in',s.moneyOk]],done=steps.filter(x=>x[1]).length;
  if(done===3)return `<div class="card ci done"><span class="okmark">✓</span> <b>Month-end check-in done.</b> <span class="muted">Numbers below are up to date.</span> <button class="lnk" data-act="checkin" data-k="4">See summary</button></div>`;
  return `<div class="card ci"><div class="ci-h"><div><b>Month-end check-in</b><div class="muted small">3 quick steps so next month's plan uses real numbers</div></div><button class="btn primary" data-act="checkin" data-k="${steps.findIndex(x=>!x[1])+1}">${done?'Continue':'Start'}</button></div>
    <ol class="ci-steps">${steps.map(([t,ok])=>`<li class="${ok?'ok':''}"><span>${ok?'✓':'○'}</span>${t}</li>`).join('')}</ol></div>`;
}
let ciPending=null;
function openCheckin(step){
  step=+step||1;const ci=(S.checkin=S.checkin||{}),mark=k=>{(ci[VM]=ci[VM]||{})[k]=TODAY};
  const dots=`<div class="ci-dots">${[1,2,3,4].map(i=>`<span class="${i<step?'ok':i===step?'on':''}"></span>`).join('')}<small>Step ${Math.min(step,4)} of 4</small></div>`;
  const nav=(back)=>`${back?`<button type="button" class="btn" data-act="checkin" data-k="${step-1}">Back</button>`:'<button type="button" class="btn" data-close>Later</button>'}<button class="btn primary">${step<4?'Next':'Done'}</button>`;
  const next=()=>{setTimeout(()=>openCheckin(step+1),0);return 'keep'};
  if(step===1){
    if(!S.accounts.length){setTimeout(()=>openCheckin(2),0);return}
    openDlg('Your bank balances',dots+`<p class="muted" style="margin-top:0">Type what your bank app shows right now.</p>${S.accounts.map(a=>fld(esc(a.name),`<input type="number" inputmode="decimal" step="0.01" name="b_${a.id}" value="${a.balance}" required>`,a.updated?`Last updated ${fd(a.updated)}`:'')).join('')}`,nav(false),

        if(ids.length)ciPending={ids,ch:(ciPending?ciPending.ch:0)+ch};return next()});
  }else if(step===2){
    const L=stmtList();

  }else if(step===3){
    const B=bundleOf(VM),occ=incOcc(B.en);
    const body=occ.length?`<p class="muted" style="margin-top:0">Money you expect before ${fd(B.en)}. Check the dates and whether you can count on each.</p>`+occ.map((o,i)=>`<div class="stm-r"><div><b>${esc(o.f.name)}</b> ${money(o.amt)}<small>${o.f.type==='monthly'?'every month':'expected'}</small></div>

  }else{

    openDlg('Your plan for next month',dots+statusCard(ctx,summary(VM))+`<p class="note">This uses your updated balances, the statements you entered and the money you are counting on. Home shows the same from now on.</p>`,
      `<button type="button" class="btn" data-act="checkin" data-k="3">Back</button><button class="btn primary">Done</button>`,()=>{mark('done');if(!U.showNext&&planCtx().early){U.showNext=true;saveU()}});
  }

    case 'weekAll':U.weekAll=!U.weekAll;saveU();render();break;
    case 'lsort':U.loanSort=b.dataset.k;saveU();render();break;
    case 'tbl':U.tbl[b.dataset.k]=!!b.dataset.v;saveU();render();break;
    case 'skip':{const j0=snap();const o=ov(m,id,true);o.skip=true;after();toast(`${esc(item(id).name)} skipped for ${fmS(m)}`,()=>restore(j0));break}
    case 'unskip':{const o=ov(m,id);if(o)delete o.skip;after();break}
    case 'dropBill':{const o=ov(m,id);if(o&&!(o.pays&&o.pays.length)){delete S.months[m][id]}dlg.close();save();render();break}
    case 'editItem':editItem(id);break;
    case 'stop':{const it=item(id);ask(`${esc(it.name)} will not appear after ${fmL(m)}. Continue?`,()=>{it.until=m;dlg.close();save();render()});break}
    case 'delItem':{const it=item(id);ask(`Delete <b>${esc(it.name)}</b> and its payments from every month? Money you paid is not put back in your accounts.`,()=>{delItemNow(id);dlg.close();save();render()},{ok:'Delete',danger:1});break}
    case 'delPay':{const o=ov(m,id);const p=o&&o.pays.find(q=>q.id===b.dataset.p);if(!p)break;const a=p.acc&&acct(p.acc);
      const doIt=back=>{const j0=snap();if(a&&back)a.balance=r2((+a.balance||0)+p.amount);o.pays=o.pays.filter(q=>q!==p);if(!o.pays.length)o.lastAcc=p.acc||'';after();toast(`Payment removed${a&&back?`, ${money(p.amount)} back in ${esc(a.name)}`:''}`,()=>restore(j0))};
      if(a&&typedAfter(a,p.at,p.date))choose(`Remove the ${money(p.amount)} payment?<br><br>You typed the ${esc(a.name)} balance after this payment (last on ${timeTxt(a)}), so it may already be right. Put ${money(p.amount)} back anyway?`,[{label:'Cancel'},{label:'Leave the balance',fn:()=>doIt(false)},{label:`Put ${money(p.amount)} back`,cls:'primary',fn:()=>doIt(true)}]);
      else ask(`Remove the ${money(p.amount)} payment?${a?` It goes back to ${esc(a.name)}.`:''}`,()=>doIt(true),{ok:'Remove',danger:1});
      break}
    case 'addAcc':accForm(null);break;
    case 'editAcc':accForm(id);break;
    case 'delAcc':{const ac=acct(id);ask(`Delete <b>${esc(ac.name)}</b>? Its ${money(ac.balance)} is no longer counted. Payments made from it stay paid, but undoing them later will not put money anywhere.`,()=>{S.accounts=S.accounts.filter(x=>x.id!==id);dlg.close();save();render()},{ok:'Delete',danger:1});break}
    case 'addInc':incForm(null);break;
    case 'editInc':incForm(id);break;
    case 'delInc':{const f=inc(id);ask(`Delete <b>${esc(f.name)}</b>?${f.link?' Its linked card repayment will be deleted too.':''}`,()=>{if(f.link)delItemNow(f.link);S.incoming=S.incoming.filter(x=>x.id!==id);dlg.close();save();render()},{ok:'Delete',danger:1});break}
    case 'recv':openRecv(id,m);break;
    case 'unrecv':{const f=inc(id);const r0=f.type==='monthly'?f.rec[m]:{amt:f.recAmt,acc:f.recAcc,date:f.recOn,at:f.recAt,added:f.recAdded};
      const a=r0&&r0.acc&&acct(r0.acc),added=r0&&r0.added!==false;
      const doIt=out=>{const j0=snap();if(f.type==='monthly')delete f.rec[m];else f.received=false;if(a&&out&&r0.amt)a.balance=r2((+a.balance||0)-r0.amt);save();render();toast(`${esc(f.name)} is expected again${a&&out?`, ${money(r0.amt)} taken out of ${esc(a.name)}`:''}`,()=>restore(j0))};
      if(!a||!added)doIt(false);
      else if(typedAfter(a,r0.at,r0.date))choose(`Undo <b>${esc(f.name)}</b>?<br><br>You typed the ${esc(a.name)} balance after this money came in (last on ${timeTxt(a)}), so it may already be right. Take ${money(r0.amt)} out anyway?`,[{label:'Cancel'},{label:'Leave the balance',fn:()=>doIt(false)},{label:`Take ${money(r0.amt)} out`,cls:'primary',fn:()=>doIt(true)}]);
      else doIt(true);
      break}
    case 'again':{const f=inc(id);incForm(null,{type:'once',name:f.name,amount:f.amount,account:f.account,sure:false});break}
    case 'settings':openSettings();break;
    case 'rsDay':rsDayInfo(b.dataset.d);break;
    case 'checkin':openCheckin(b.dataset.k);break;
    case 'payAll':openPayAll(b.dataset.k);break;
    case 'stmts':openStatements();break;
    case 'rmenu':openRowMenu(id);break;
    case 'manage':nav('manage');break;
    case 'dup':{const it=item(id),c=JSON.parse(JSON.stringify(it));c.id=uid();c.name=it.name+' (copy)';delete c.link;const i=S.items.indexOf(it);S.items.splice(i+1,0,c);
      Object.values(S.months).forEach(mo=>{if(mo[id]){const o=JSON.parse(JSON.stringify(mo[id]));delete o.pays;delete o.lastAcc;if(Object.keys(o).length)mo[c.id]=o}});
      save();render();itemForm(kindOf(c),c);toast(`Copied. Change what is different and save.`);break}
    case 'addOwner':{const n=($('#newOwner').value||'').trim();if(!n)break;if(S.owners.some(o=>o.toLowerCase()===n.toLowerCase())){toast(`${esc(n)} is already there`);break}S.owners.push(n);save();render();break}
    case 'delOwner':{const n=b.dataset.e;S.owners=S.owners.filter(o=>o!==n);save();render();break}
    case 'addCat':{const n=($('#newCatName').value||'').trim();if(n){newCat(n,'bill');after()}break}
    case 'delCat':{if(S.items.some(i=>i.cat===id)){note('Move or delete the items in this category first.');break}S.cats=S.cats.filter(c=>c.id!==id);after();break}
    case 'exportJson':download(`dues-planner-backup-${TODAY}.json`,JSON.stringify(S,null,1),'application/json');break;
    case 'importJson':$('#file').click();break;
    case 'exportCsv':{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';const rows=[['Pay by','Name','Owner','Category','Amount','Estimate','Paid','Left','Status']].concat(summary(VM).L.sort(byDue).map(x=>[x.due||'',x.it.name,x.it.owner||'',catOf(x.it.cat).name,x.amount,x.confirmed?'':'yes',x.paid,x.rem,x.status]));download(`dues-${VM}.csv`,'﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv');break}
    case 'reset':ask(Cloud.on?'Erase everything and start again, on all your devices? Download a backup first if you are unsure.':'Erase everything and start again? Download a backup first if you are unsure.',()=>{S=fresh();S.items=[];S.accounts=[];S.incoming=[];S.months={};S.owners=['Me'];S.startMonth=CUR;VM=defMonth();dlg.close();save();render()},{ok:'Erase everything',danger:1});break;
  }
});
document.addEventListener('input',e=>{if(e.target.id==='mSearch'){U.q=e.target.value;filterManage(U.q.trim().toLowerCase())}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('#view input[data-edit],#view input[data-accname],#view input[data-owner],#view input[data-catname],#view input[data-bal]')){e.preventDefault();e.target.blur()}if(e.key==='Enter'&&e.target.id==='newOwner'){e.preventDefault();$('[data-act=addOwner]').click()}if(e.key==='Enter'&&e.target.id==='newCatName'){e.preventDefault();$('[data-act=addCat]').click()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.row[data-act]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.bal){const a=acct(t.dataset.bal);
    if(String(t.value).trim()===''){t.value=a.balance;toast('Balance not changed. The box was empty.');return}
    const j0=snap(),old=+a.balance||0;a.balance=num(t.value);markChecked(a);save();render();setTimeout(()=>reconcile([a.id],a.balance-old),50);
    toast(`${esc(a.name)}: ${money(old)} \u2192 ${money(a.balance)}`,()=>restore(j0))}
  else if(t.hasAttribute('data-buffer')){S.buffer=Math.max(0,num(t.value));save();render()}
  else if(t.dataset.count){const f=inc(t.dataset.count);if(f){f.sure=t.checked;save();render()}}
  else if(t.hasAttribute('data-planfrom')){let v=Math.max(1,parseInt(t.value)||15),msg='';const lim=S.bundle.from-1;
    if(v>lim){v=lim;msg=`Planning has to start before next month's bills (the ${ord(S.bundle.from)}), so it is set to the ${ord(v)}.`}
    S.planFrom=v;t.value=v;save();render();toast(msg||`Next month's bills show on Home from the ${ord(v)}`)}
  else if(t.dataset.bundle){const k=t.dataset.bundle,v=parseInt(t.value)||0,B0=S.bundle;
    let nv=k==='from'?Math.min(31,Math.max(2,v)):Math.min(30,Math.max(1,v)),msg='';
    const from=k==='from'?nv:B0.from,to=k==='to'?nv:B0.to;
    if(to>=from){if(k==='to'){nv=from-1;msg=`The "to" day must be before the ${ord(from)}, so it is set to the ${ord(nv)}.`}else{nv=to+1;msg=`The "from" day must be after the ${ord(to)}, so it is set to the ${ord(nv)}.`}}
    S.bundle[k]=nv;t.value=nv;save();render();
    toast(msg||`Next month's bills: ${ord(S.bundle.from)} of this month to ${ord(S.bundle.to)} of next month`)}
  else if(t.dataset.catname){const c=catOf(t.dataset.catname);c.name=t.value.trim()||c.name;save();render()}
  else if(t.dataset.edit){const it=item(t.dataset.id);if(!it)return;const k=t.dataset.edit,j0=snap();
    if(String(t.value).trim()===''){render();toast('Not changed. The box was empty.');return}
    if(k==='amount'){const v=r2(Math.max(0,num(t.value)));if(v===(+it.amount||0))return;freezePast(it,VM);const old=it.amount;it.amount=v;
      if(kindOf(it)==='card'||kindOf(it)==='bill'){}save();render();toast(`${esc(it.name)}: ${money(old)} → ${money(v)} from ${fmS(VM)}`,()=>restore(j0))}
    else{const v=Math.min(31,Math.max(1,parseInt(t.value)||1));const r0=it.rule||{};if(v===r0.day){t.value=v;return}freezePast(it,VM);it.rule=Object.assign({},r0,{type:'day',day:v});save();render();toast(`${esc(it.name)}: due on the ${ord(v)} from ${fmS(VM)}`,()=>restore(j0))}}
  else if(t.dataset.accname){const a=acct(t.dataset.accname);const v=t.value.trim();if(a&&v){a.name=v;save();render()}else render()}
  else if(t.dataset.owner){const o=t.dataset.owner,v=t.value.trim();if(!v||v===o||S.owners.includes(v)){render();return}
    S.owners=S.owners.map(x=>x===o?v:x);S.items.forEach(i=>{if(i.owner===o)i.owner=v});save();render();toast(`Renamed to ${esc(v)}`)}
});
$('#file').addEventListener('change',e=>{
  const fl=e.target.files[0];if(!fl)return;const rd=new FileReader();
  rd.onload=()=>{try{const o=JSON.parse(rd.result);migrate(o);if(o.v!==6||!o.items||!o.cats)throw 0;const go=()=>{S=o;VM=defMonth();save();dlg.close();if(gated()){cloudPush().then(openApp)}else render()};if(gated())go();else ask(Cloud.on?'Replace everything with this backup, on all your devices?':'Replace everything here with this backup?',go,{ok:'Replace'})}catch(_){note('That file is not a Dues Planner backup.')}e.target.value=''};
  rd.readAsText(fl);
});
const onHash=()=>{const h=readHash();if(h&&h!==curR){curR=h;if(dlg.open)dlg.close();render();scrollTo(0,0)}};
addEventListener('hashchange',onHash);addEventListener('popstate',onHash);
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(render,150)});
if(!CAN_SAVE)$('#notice').innerHTML='<div><b>Saving is off in this preview.</b> Changes here are lost when you close it. Download the file and open it in Chrome, Safari or Edge to keep your data.</div>';
if(Cloud.on)cloudBoot();else render();
syncBadge();
</script>
