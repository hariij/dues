<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#E2E4DA">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap">
<title>Dues Planner</title>
<style>
:root{
  color-scheme:light;
  --bg:#f5f4f0;--surface:#fcfcfb;--raise:#ffffff;--ink:#0b0b0b;--ink2:#52514e;--ink3:#77766f;--line:#e3e2dc;--grid:#ecebe6;--hover:#f1f0eb;
  --k1:#2a78d6;--k2:#1baf7a;--k3:#eb6834;--k4:#4a3aa7;--k5:#eda100;--k6:#e87ba4;--k7:#008300;
  --good:#0ca30c;--warn:#fab219;--warn-ink:#8a5a00;--crit:#d03b3b;--crit-bg:#fbeaea;--warn-bg:#fdf3dc;--good-bg:#e6f5e6;
  --accent:#2a78d6;--accent-ink:#fff;--soon-ink:#b86200;
}
@media (prefers-color-scheme:dark){
  :root:where(:not([data-theme="light"])){
    color-scheme:dark;
    --bg:#121211;--surface:#1a1a19;--raise:#222220;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#9a998f;--line:#2f2f2c;--grid:#282826;--hover:#252523;
    --k1:#3987e5;--k2:#199e70;--k3:#d95926;--k4:#9085e9;--k5:#c98500;--k6:#d55181;--k7:#008300;
    --warn-ink:#fab219;--crit-bg:#3a1f1f;--warn-bg:#3a3018;--good-bg:#1d331d;--accent:#3987e5;--soon-ink:#f0a04b;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211;--surface:#1a1a19;--raise:#222220;--ink:#ffffff;--ink2:#c3c2b7;--ink3:#9a998f;--line:#2f2f2c;--grid:#282826;--hover:#252523;
  --k1:#3987e5;--k2:#199e70;--k3:#d95926;--k4:#9085e9;--k5:#c98500;--k6:#d55181;--k7:#008300;
  --warn-ink:#fab219;--crit-bg:#3a1f1f;--warn-bg:#3a3018;--good-bg:#1d331d;--accent:#3987e5;--soon-ink:#f0a04b;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.25}
.num,.amt,td.n,th.n{font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}
.small{font-size:12.5px}

/* header */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1080px;margin:0 auto;padding:10px 16px 0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{font-size:17px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.month button:hover{background:var(--hover)}
.month button:disabled{opacity:.25;cursor:default;background:none}
.month span{min-width:128px;text-align:center;font-weight:650;font-size:14px}
.nav{max-width:1080px;margin:0 auto;padding:0 10px;display:flex;gap:2px}
.nav a{display:flex;align-items:center;gap:7px;padding:10px 12px 11px;text-decoration:none;font-weight:600;font-size:14px;color:var(--ink2);border-bottom:2px solid transparent}
.nav a[aria-current=page]{color:var(--ink);border-color:var(--ink)}
.nav svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.fab{display:none}
main{max-width:1080px;margin:0 auto;padding:16px 16px 40px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 13px;min-height:38px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.sm{min-height:32px;padding:4px 11px;font-size:13px;border-radius:9px}
.btn.ghost{background:none;border-color:transparent}
.btn.danger{color:var(--crit)}
.btn.wide{width:100%}
.icon-btn{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:17px}
.icon-btn:hover{background:var(--hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lnk{background:none;border:0;padding:0;cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;text-decoration:none}

/* layout pieces */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.stack>*+*{margin-top:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 2px 10px}
.sec-h h2{font-size:15.5px;font-weight:700}
.sec-h .seg{flex-wrap:nowrap;flex:none}
.sec-h .sub{font-size:13px;color:var(--ink2)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.card-h h2{font-size:15.5px;font-weight:700}
.note{font-size:12.5px;color:var(--ink2);margin:4px 0 0}

/* status banner */
.banner{display:flex;gap:12px;border-radius:14px;padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.banner .ic{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:14px;color:#fff;background:var(--good)}
.banner.bad{background:var(--crit-bg);border-color:transparent}
.banner.bad .ic{background:var(--crit)}
.banner.warn{background:var(--warn-bg);border-color:transparent}
.banner.warn .ic{background:var(--warn);color:#000}
.banner>div:last-child{min-width:0;flex:1}
.banner b.h{display:block;font-size:16px;margin-bottom:2px}
.banner p{margin:3px 0 0;font-size:14px}
.banner .steps{margin:8px 0 0;padding:0;list-style:none;font-size:13.5px}
.banner .steps li{display:flex;gap:8px;justify-content:space-between;padding:3px 0;border-top:1px dashed color-mix(in srgb,var(--ink2) 30%,transparent)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12.5px;color:var(--ink2);font-weight:600}
.kpi .v{font-size:23px;font-weight:700;letter-spacing:-.015em;font-variant-numeric:tabular-nums;white-space:nowrap}
.kpi .s{font-size:12.5px;color:var(--ink2)}
.kpi .s .i{font-weight:800}
.kpi.bad .v{color:var(--crit)}
.meter{height:6px;border-radius:3px;background:var(--grid);overflow:hidden;margin-top:6px}
.meter>i{display:block;height:100%;border-radius:3px;background:var(--c,var(--ink2))}

/* week strip */
.week .wk-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px;align-items:baseline;margin-bottom:4px}
.week .wk-h h2{font-size:15.5px}

/* category cards */
.catgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.cat{display:block;text-decoration:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;position:relative;overflow:hidden}
.cat:hover{background:var(--hover)}
.cat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c)}
.cat .t{display:flex;justify-content:space-between;font-weight:650;font-size:14px}
.cat .big{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px}
.cat .big small{font-size:13px;font-weight:500;color:var(--ink2)}
.cat .m{font-size:12.5px;color:var(--ink2);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}

/* rows */
.list{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:50px 1fr auto 76px;gap:4px 12px;align-items:center;padding:10px 14px 10px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.row:last-child{border-bottom:0}
.row:hover{background:var(--hover)}
.row.hot::before,.row.soon::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:2px;background:var(--crit)}
.row.soon::before{background:var(--warn)}
.row.hot{background:color-mix(in srgb,var(--crit-bg) 70%,transparent)}
.dt{text-align:center;line-height:1.05;border-radius:10px;padding:5px 0;background:var(--hover)}
.dt b{display:block;font-size:17px;font-weight:700}
.dt span{font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2);font-weight:600}
.dt.nd b{font-size:11px;font-weight:600;color:var(--ink2);text-transform:none;letter-spacing:0;padding:3px 0}
.nm{min-width:0}
.nm .a{font-weight:600;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.nm .b{font-size:12.5px;color:var(--ink2)}
.tag{font-size:11.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:0 7px;color:var(--ink2);background:var(--surface)}
.est{font-size:11px;font-weight:700;border-radius:999px;padding:0 6px;color:var(--ink2);border:1px dashed var(--ink3);margin-right:4px;vertical-align:1px}
.rt{text-align:right;min-width:0}
.rt .amt{font-weight:700;white-space:nowrap}
.rt .sub{font-size:12px;color:var(--ink2);white-space:nowrap}
.flag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;white-space:nowrap}
.flag.crit{color:var(--crit)}
.flag.warn{color:var(--warn-ink)}
.flag.warn::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn)}
.flag.good{color:var(--good)}
.row.paid .nm .a,.row.paid .amt{color:var(--ink2)}
.row .act{display:flex;justify-content:flex-end}
.okmark{color:var(--good);font-weight:700;font-size:13px}

/* dues groups */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.seg{display:inline-flex;background:var(--hover);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button,.seg label{border:0;background:none;padding:5px 12px;border-radius:8px;cursor:pointer;font-weight:600;font-size:13.5px;color:var(--ink2);display:inline-flex;align-items:center}
.seg button[aria-pressed=true],.seg label:has(input:checked){background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.seg label{position:relative}
.seg input{position:absolute;inset:0;opacity:0;pointer-events:none;margin:0}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.grp-h{display:grid;grid-template-columns:auto 1fr auto 20px;gap:4px 10px;align-items:center;width:100%;padding:14px 14px 8px;background:none;border:0;text-align:left;cursor:pointer}
.grp-h .gn{font-weight:700;font-size:15.5px}
.grp-h .gm{grid-column:2/3;font-size:12.5px;color:var(--ink2)}
.grp-h .ga{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.grp-h .ga small{display:block;font-weight:500;font-size:12px;color:var(--ink2)}
.grp-h .chev{transition:transform .15s;color:var(--ink2)}
.grp[data-open=false] .chev{transform:rotate(-90deg)}
.grp[data-open=false] .gbody{display:none}
.grp .meter{margin:0 14px 12px}
.gfoot{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;justify-content:space-between;padding:10px 14px;border-top:1px solid var(--line);font-size:13px;color:var(--ink2)}
.gfoot .nd{display:flex;flex-direction:column;gap:2px}
.addin{border:1px dashed var(--ink3);background:none;border-radius:9px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:13px;color:var(--ink2)}
.addin:hover{color:var(--ink);border-color:var(--ink2)}
.dategrp-h{display:flex;justify-content:space-between;padding:10px 14px 4px;font-size:13px;font-weight:700;color:var(--ink2);background:var(--bg)}
.empty{padding:18px 14px;color:var(--ink2);font-size:14px}

/* money */
.mrow{display:grid;grid-template-columns:50px 1fr auto auto;gap:4px 12px;align-items:center;padding:11px 14px 11px 12px;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.mrow input.bal{width:140px;text-align:right;font-weight:700}
.mrow.done{opacity:.7}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.ico{display:grid;place-items:center;width:42px;height:42px;border-radius:11px;background:var(--hover);font-size:18px}
.buffer{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.buffer input.num{width:150px;text-align:right;font-weight:700}

/* charts */
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible;touch-action:pan-y}
.legend{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px;color:var(--ink2);margin:6px 0 8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ln{width:18px;height:0;border-top:2px solid var(--c)}
.legend .ln.dash{border-top-style:dashed}
.ax{fill:var(--ink2);font-size:11px}
.gl{stroke:var(--grid);stroke-width:1}
.tip{position:absolute;pointer-events:none;background:var(--raise);border:1px solid var(--line);box-shadow:0 6px 18px rgba(0,0,0,.16);border-radius:10px;padding:8px 10px;font-size:12.5px;z-index:5;min-width:170px;max-width:290px;display:none}
.tip .r{display:flex;justify-content:space-between;gap:14px}
.tip b{font-variant-numeric:tabular-nums}
.tip .hd{font-weight:700;margin-bottom:3px}

/* tables */
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--ink2);font-weight:650}
td.n,th.n{text-align:right}
tfoot td{font-weight:700;border-bottom:0}

.insights{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:14px}
.two{display:grid;grid-template-columns:1fr;gap:14px}

/* dialog */
dialog{border:0;padding:0;border-radius:18px;width:min(500px,calc(100vw - 24px));max-height:min(88vh,860px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(0,0,0,.45)}
dialog form{display:flex;flex-direction:column;max-height:inherit}
.dh{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.dh h3{font-size:18px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.x{border:0;background:var(--hover);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:18px;flex:none}
.db{padding:4px 18px 14px;overflow:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.db h4{font-size:12.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:18px 0 6px}
.fld{display:flex;flex-direction:column;gap:5px;margin:12px 0 0}
.fld>span{font-size:13px;font-weight:650;color:var(--ink2)}
.fld small{font-size:12px;color:var(--ink3);line-height:1.4}
input:not([type=checkbox]):not([type=radio]),select{width:100%;background:var(--raise);border:1px solid var(--line);border-radius:10px;padding:8px 11px;min-height:42px}
input[inputmode]{font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.chk{display:flex;gap:9px;align-items:flex-start;margin:12px 0 0;font-size:14px;cursor:pointer}
.chk input{margin-top:3px;width:17px;height:17px;flex:none}
.quick{display:flex;gap:6px;margin-top:6px}
.tiles{display:grid;gap:8px}
.tile{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;cursor:pointer}
.tile:hover{background:var(--hover);border-color:var(--ink3)}
.tile .ico{grid-row:1/3}
.tile b{font-size:15px}
.tile span{font-size:12.5px;color:var(--ink2)}
.sumbox{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;background:var(--hover);border-radius:12px;padding:12px 14px;margin:10px 0}
.sumbox .big{display:block;font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.pays{list-style:none;padding:0;margin:0}
.pays li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.hint{font-size:12.5px;color:var(--ink2);background:var(--hover);border-radius:10px;padding:8px 11px;margin:12px 0 0}
.pickcards{display:grid;gap:6px}
.pickcards button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;cursor:pointer}
.pickcards button:hover{background:var(--hover)}
[hidden]{display:none!important}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--ink2);vertical-align:2px;margin-left:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ink3)}
.sync.ok::before{background:var(--good)}.sync.warn::before{background:var(--warn)}.sync.bad{color:var(--crit)}.sync.bad::before{background:var(--crit)}
body.gated .nav,body.gated main,body.gated .fab,body.gated .top .month,body.gated #addTop{display:none!important}
#gate{max-width:440px;margin:0 auto;padding:40px 16px}
body:not(.gated) #gate{display:none}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:24px 20px;display:flex;flex-direction:column;gap:10px}
.gate-card h2{font-size:18px}
.row{padding:9px 14px 9px 12px;grid-template-columns:46px minmax(0,1fr) auto 70px}
.row .nm .a .t{overflow:hidden;text-overflow:ellipsis}
.row .nm .b{display:flex;flex-wrap:wrap;gap:0 6px;align-items:center}
.row .dot{color:var(--ink3)}
.dt{padding:4px 0}.dt b{font-size:16px}
.est{font-size:11px;font-weight:700;border-radius:999px;padding:0 7px;color:var(--ink2);border:1px dashed var(--ink3)}
.banner p.big1{font-size:20px;font-weight:700;margin:4px 0 0}
.banner p.next{margin-top:10px;padding-top:10px;border-top:1px dashed color-mix(in srgb,var(--ink2) 30%,transparent)}
.banner .lbl{margin:10px 0 2px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)}
.ready{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px;margin:2px 0 0;font-size:14.5px}
.ready .sep{color:var(--ink3)}
.warnline{margin-top:10px!important;font-size:13.5px;color:var(--crit)}
details.more{margin-top:8px}details.more>summary,details.paidfold>summary,details.paidlist>summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:13.5px;list-style:none}
details.more>summary::-webkit-details-marker,details.paidfold>summary::-webkit-details-marker,details.paidlist>summary::-webkit-details-marker,details.todo-g>summary::-webkit-details-marker{display:none}
details.paidfold>summary{padding:10px 14px;border-top:1px solid var(--line);color:var(--ink2)}
details.paidfold[open]>summary{color:var(--ink)}
details.paidlist>summary{padding:12px 14px;border-top:1px solid var(--line)}
.todos{padding:0;overflow:hidden}
.todo{display:grid;grid-template-columns:110px minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.todo:hover{background:var(--hover)}
.todo .when{color:var(--ink2);font-size:13.5px}
.todo .amt{font-variant-numeric:tabular-nums;white-space:nowrap}
.todo.money{background:color-mix(in srgb,var(--good-bg) 60%,transparent)}
.todo.stm .when{color:var(--ink2)}
details.todo-g{border-bottom:1px solid var(--line)}details.todo-g>summary{list-style:none;border-bottom:0}
details.todo-g .chev{color:var(--ink2);transition:transform .15s;width:62px;text-align:center}details.todo-g[open] .chev{transform:rotate(180deg)}

.wk>summary{list-style:none;cursor:pointer;padding:12px 14px 12px 18px}.wk>summary::-webkit-details-marker{display:none}
.wk-h{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:flex-start}
.wk-k{display:flex;flex-wrap:wrap;gap:4px 20px;text-align:right}.wk-k span{display:flex;flex-direction:column}.wk-k small{font-size:11.5px;color:var(--ink3)}.wk-k b{font-variant-numeric:tabular-nums}
.wk-b{border-top:1px solid var(--line)}
.act-list{padding:0}
.act{display:grid;grid-template-columns:78px 1fr auto;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;align-items:start}
.act:last-child{border-bottom:0}
.act-t{font-variant-numeric:tabular-nums;color:var(--ink2);font-size:13px}.act-t small{display:block;font-size:11.5px;color:var(--ink3)}
.act-l details summary{cursor:pointer;color:var(--accent);font-size:12.5px;font-weight:600}
.act.undone .act-l{text-decoration:line-through;color:var(--ink3)}
.sharebox{width:100%;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap}
.ver{color:var(--ink3);margin-top:14px}
@media (max-width:640px){
  .cgrid{gap:2px}.cd{min-height:66px;padding:3px 3px;border-radius:7px}.cn{font-size:12px}
  .cdue,.cin{font-size:11px}.cbal{font-size:10px}.cdots i{width:5px;height:5px}
  .act{grid-template-columns:60px 1fr auto;padding:10px 12px}
  .wk-k{text-align:left}
}

/* budgets */
.bmeter{display:block;height:5px;border-radius:3px;background:var(--grid);margin-top:5px;overflow:hidden;max-width:260px}
.bmeter i{display:block;height:100%;background:var(--good);border-radius:3px}
.bmeter.over i{background:var(--crit)}
.trow.bud .tn small{display:block}
.row.bud .nm .b{color:var(--ink2)}

/* ================= NEO-BRUTALIST THEME ("rupee notes") ================= */
:root{
  --bg:#E2E4DA;--surface:#FFFFFF;--raise:#FFFFFF;--ink:#000000;--ink2:#3B3B3B;--ink3:#6E6E6E;--line:#000000;--grid:#D6D8CE;--hover:#FFF4CC;
  --k1:#2EC4F1;--k2:#22C997;--k3:#FF4FA3;--k4:#9E8BFF;--k5:#FFC21A;--k6:#C47A42;--k7:#7FD13B;
  --good:#12A456;--good-ink:#086B36;--warn:#FFC21A;--warn-ink:#6E4B00;--crit:#E5341F;--crit-ink:#B3170B;--crit-bg:#FFD6CF;--warn-bg:#FFEDB3;--good-bg:#C9F2D9;
  --accent:#000000;--accent-ink:#FFFFFF;--mark:#FFC21A;--edge:#000000;--soon-ink:#9A4A00;
  --sh:3px 3px 0 var(--edge);--sh-lg:6px 6px 0 var(--edge);--r:8px;--r-sm:6px;--bw:2px;
  --f:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])){
  --bg:#000000;--surface:#161616;--raise:#1E1E1E;--ink:#FFFFFF;--ink2:#D0D0D0;--ink3:#9C9C9C;--line:#EDEDED;--grid:#2E2E2E;--hover:#2A2410;--edge:#EDEDED;
  --good:#22C467;--good-ink:#5BE38F;--warn-ink:#FFC21A;--crit:#FF5A45;--crit-ink:#FF8A7A;--crit-bg:#3E120C;--warn-bg:#3A2D00;--good-bg:#0C3320;--soon-ink:#FFB25C;--accent:#FFFFFF;--accent-ink:#000000}}
:root[data-theme="dark"]{
  --bg:#000000;--surface:#161616;--raise:#1E1E1E;--ink:#FFFFFF;--ink2:#D0D0D0;--ink3:#9C9C9C;--line:#EDEDED;--grid:#2E2E2E;--hover:#2A2410;--edge:#EDEDED;
  --good:#22C467;--good-ink:#5BE38F;--warn-ink:#FFC21A;--crit:#FF5A45;--crit-ink:#FF8A7A;--crit-bg:#3E120C;--warn-bg:#3A2D00;--good-bg:#0C3320;--soon-ink:#FFB25C;--accent:#FFFFFF;--accent-ink:#000000}
body{font-family:var(--f);font-size:15px;font-variation-settings:"wdth" 100;letter-spacing:0}
h1,h2,h3,h4,.brand,.big,.v,.gn{font-family:var(--f)}
.xp{font-stretch:125%;font-variation-settings:"wdth" 125}

/* header */
.top{background:var(--bg);backdrop-filter:none;border-bottom:var(--bw) solid var(--edge)}
.brand{display:flex;align-items:center;gap:9px;font-weight:900;font-size:18px;font-variation-settings:"wdth" 125;letter-spacing:-.01em}
.brand .logo{display:grid;place-items:center;width:30px;height:30px;background:var(--mark);color:#000;border:var(--bw) solid var(--edge);border-radius:var(--r-sm);box-shadow:2px 2px 0 var(--edge);font-size:16px;font-weight:900;font-variation-settings:"wdth" 100}
.month{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--r);padding:1px;box-shadow:none}
.month span{font-weight:800}
.month button{border-radius:var(--r-sm)}
.month button:hover{background:var(--hover)}
.nav{gap:6px;padding:0 16px 12px}
.nav a{border:var(--bw) solid transparent;border-radius:var(--r);padding:7px 12px;font-weight:700;color:var(--ink)}
.nav a:hover{border-color:var(--edge);background:var(--surface)}
.nav a[aria-current=page]{background:var(--ink);color:var(--bg);border-color:var(--edge)}
.nav svg{stroke-width:2.2}
.sync{font-weight:700;color:var(--ink2);font-variation-settings:"wdth" 100;font-size:11.5px;border:1.5px solid var(--edge);border-radius:999px;padding:1px 8px 1px 6px;margin-left:2px}
.sync::before{border:1.5px solid var(--edge)}

/* buttons, inputs */
.btn{border:var(--bw) solid var(--edge);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--sh);transition:transform .08s,box-shadow .08s}
.btn:hover{background:var(--hover);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--edge)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--edge)}
.btn.primary{background:var(--mark);border-color:var(--edge);color:#000}
.btn.primary:hover{filter:none;background:#FFD24D}
.btn.sm{border-radius:var(--r-sm);box-shadow:2px 2px 0 var(--edge);min-height:32px}
.btn.sm:hover{box-shadow:3px 3px 0 var(--edge)}
.btn.ghost{background:transparent;border-color:var(--edge);box-shadow:none}
.btn.ghost:hover{box-shadow:2px 2px 0 var(--edge)}
.btn.danger{color:var(--crit-ink)}
.btn.dangerbg{background:var(--crit);color:#fff;border-color:var(--edge)}
.icon-btn{border:var(--bw) solid var(--edge);border-radius:var(--r-sm);background:var(--surface);box-shadow:2px 2px 0 var(--edge)}
.icon-btn:hover{background:var(--hover)}
:focus-visible{outline:3px solid var(--k1);outline-offset:2px}
.lnk{color:var(--ink);font-weight:700;text-decoration:underline;text-decoration-color:var(--mark);text-decoration-thickness:3px;text-underline-offset:3px}
.lnk:hover{background:var(--mark);color:#000}
.lnk.plain{text-decoration:none}.lnk.plain:hover{background:none;text-decoration:underline;text-decoration-color:var(--mark)}
input:not([type=checkbox]):not([type=radio]),select,textarea{border:var(--bw) solid var(--edge);border-radius:var(--r-sm);background:var(--raise);color:var(--ink);font-family:var(--f)}
input:not([type=checkbox]):not([type=radio]):focus,select:focus,textarea:focus{outline:0;box-shadow:3px 3px 0 var(--mark);border-color:var(--edge)}
input[type=checkbox],input[type=radio]{accent-color:#000}
.seg{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--r);padding:2px;gap:2px}
.seg button,.seg label{color:var(--ink);font-weight:700;border-radius:var(--r-sm)}
.seg button:hover,.seg label:hover{background:var(--hover)}
.seg button[aria-pressed=true],.seg label:has(input:checked){background:var(--ink);color:var(--surface);box-shadow:none}
.chip{border:var(--bw) solid var(--edge);border-radius:999px;font-weight:700;background:var(--surface)}
.chip:hover{background:var(--hover)}
.tag{border:1.5px solid var(--edge);color:var(--ink);font-weight:700;background:var(--k4);color:#000}
.est{border:1.5px dashed var(--edge);color:var(--ink);font-weight:700}

/* panels */
.card,.grp,.kpi,.gate-card,.cat{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--r)}
.grp{overflow:hidden}
.sec-h{margin:28px 2px 10px}
.sec-h h2,.card-h h2{font-size:19px;font-weight:900;font-variation-settings:"wdth" 125;letter-spacing:-.01em}
.sec-h .sub{color:var(--ink2);font-weight:600}
.note{color:var(--ink2)}
.list,.row,.mrow,.mrow2,.gfoot,.tsum,details.paidfold>summary,.tday,.act,.pays li,.stm-r,.cnt-r,.mc-r,th,td,table.calc td,.pr{border-color:color-mix(in srgb,var(--edge) 22%,transparent)}
.list{border-top:var(--bw) solid var(--edge)}
.meter,.bmeter,.mprog{background:var(--surface);border:1.5px solid var(--edge);height:10px;border-radius:3px}
.meter>i,.bmeter i,.mprog i{border-radius:0;background:var(--c,var(--good))}
.bmeter i{background:var(--good)}.bmeter.over i{background:var(--crit)}
.sw{border:1.5px solid var(--edge);width:12px;height:12px;border-radius:3px}
.okmark{color:var(--good-ink)}
.neg,.flag.crit,.warnline{color:var(--crit-ink)}
.flag.warn{color:var(--warn-ink)}
.flag.warn::before{border:1.5px solid var(--edge);width:9px;height:9px}
.dt{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--r-sm)}
.dt span{text-transform:none;letter-spacing:0;color:var(--ink);font-weight:700}
.dt.nd{background:var(--hover)}
.row:hover,.trow:hover,.todo:hover,.mact:hover,.tile:hover,.pickcards button:hover{background:var(--hover)}
.row.hot{background:color-mix(in srgb,var(--crit-bg) 55%,transparent)}
.row.hot::before,.row.soon::before{width:5px;border-radius:0;top:0;bottom:0}
.grp-h .gn{font-size:18px;font-weight:900;font-variation-settings:"wdth" 125}
.grp-h .sw,.msec-h .sw{width:16px;height:16px;border-radius:4px}
.addin{border:var(--bw) dashed var(--edge);color:var(--ink);font-weight:700;border-radius:var(--r-sm)}
.dategrp-h{background:var(--hover);color:var(--ink);border-top:var(--bw) solid var(--edge);border-bottom:1px solid color-mix(in srgb,var(--edge) 22%,transparent)}
.ico{background:var(--mark);border:var(--bw) solid var(--edge);border-radius:var(--r-sm)}
.ico.sm{background:transparent;border:0}
.mact,.tile,.pickcards button{border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:2px 2px 0 var(--edge)}
.mact.danger b{color:var(--crit-ink)}
.hint{background:var(--hover);border:1.5px solid var(--edge);border-radius:var(--r-sm);color:var(--ink)}
.hint.warn{background:var(--crit-bg)}
.sumbox{background:var(--hover);border:var(--bw) solid var(--edge);border-radius:var(--r)}
.sumbox .big{font-weight:900;font-variation-settings:"wdth" 125;font-size:26px}
.kpi .v{font-weight:900;font-variation-settings:"wdth" 125}
.kpi .l,.mc-sub,.ph2,.banner .lbl,.db h4,table.steps2 th,.mlab{text-transform:none;letter-spacing:0;font-weight:800;color:var(--ink)}
.mc-sub{font-size:14px}
.db h4{font-size:15px;margin:22px 0 6px;font-variation-settings:"wdth" 125;font-weight:900}
.tip{border:var(--bw) solid var(--edge);border-radius:var(--r-sm);box-shadow:var(--sh);background:var(--surface)}
table.calc tr.tot td{border-top:var(--bw) solid var(--edge)}

/* banners (used across screens) */
.banner{border:var(--bw) solid var(--edge);border-radius:var(--r);background:var(--surface)}
.banner .ic{border:var(--bw) solid var(--edge);color:#000;background:var(--good);width:30px;height:30px;border-radius:var(--r-sm)}
.banner.bad{background:var(--crit-bg);border-color:var(--edge)}.banner.bad .ic{background:var(--crit);color:#fff}
.banner.warn{background:var(--warn-bg);border-color:var(--edge)}.banner.warn .ic{background:var(--mark)}
.banner b.h{font-size:18px;font-weight:900;font-variation-settings:"wdth" 125}

/* dialog, toast */
dialog{border:3px solid var(--edge);border-radius:var(--r);box-shadow:8px 8px 0 var(--edge);background:var(--surface)}
dialog::backdrop{background:rgba(20,20,20,.55)}
.dh h3{font-size:20px;font-weight:900;font-variation-settings:"wdth" 125;letter-spacing:-.01em}
.x{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--r-sm);color:var(--ink)}
.x:hover{background:var(--hover)}
.df{border-top:var(--bw) solid var(--edge);background:var(--bg)}
.fld>span{color:var(--ink);font-weight:800}
.cfm{border-radius:var(--r)}
#toast{background:#000;color:#fff;border:var(--bw) solid #000;border-radius:var(--r-sm);box-shadow:4px 4px 0 var(--mark)}
#toast .lnk{color:var(--mark);text-decoration-color:var(--mark)}
#notice div{background:var(--warn-bg);border:var(--bw) solid var(--edge);border-radius:var(--r)}

/* to do */
.todos{padding:0}
.tsum{font-weight:700;color:var(--ink);background:var(--hover);border-bottom:var(--bw) solid var(--edge)}
.tday{box-shadow:inset 6px 0 0 var(--u);border-bottom:var(--bw) solid var(--edge)}
.tday:last-of-type{border-bottom:0}
.tday.u-late,.tday.u-now{--u:var(--crit)}.tday.u-soon{--u:#FF8A1F}.tday.u-week{--u:var(--mark)}.tday.u-later{--u:var(--grid)}.tday.u-info{--u:var(--k1)}
.tday.u-late,.tday.u-now{background:color-mix(in srgb,var(--crit-bg) 45%,var(--surface))}
.tday-h{padding:11px 14px 4px 20px}
.tday-h .dl b{font-size:15px;font-weight:900;font-variation-settings:"wdth" 118}
.tday.u-late .tday-h .dl b,.tday.u-now .tday-h .dl b{color:var(--crit-ink)}.tday.u-soon .tday-h .dl b{color:var(--soon-ink)}
.trow{padding:7px 14px 7px 20px}
.trow .amt{font-weight:800}
.ulegend{border-top:var(--bw) solid var(--edge);color:var(--ink);font-weight:600}
.ulegend span::before{border:1.5px solid var(--edge);width:11px;height:11px}
.ulegend .u-soon{--u:#FF8A1F}.ulegend .u-week{--u:var(--mark)}.ulegend .u-later{--u:var(--grid)}
.todo-tabs{border-width:var(--bw)}

/* ---------- Home verdict: the one loud thing ---------- */
.verdict{--vb:var(--good);background:var(--vb);color:#000;border:3px solid var(--edge);border-radius:var(--r);box-shadow:var(--sh-lg);padding:18px 20px 16px;position:relative}
.verdict.warn{--vb:var(--mark)}
.verdict.bad{--vb:#FF6A57}
.verdict .vk{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;font-weight:800;font-size:15px}
.verdict .vk .pill{flex:none;background:#000;color:var(--vb);border-radius:999px;padding:2px 10px;font-size:12.5px;font-weight:800;white-space:nowrap}
.verdict .vbig{font-weight:900;font-stretch:125%;font-variation-settings:"wdth" 125;font-size:clamp(40px,9vw,76px);line-height:.95;letter-spacing:-.02em;margin:8px 0 6px;font-variant-numeric:tabular-nums;word-break:break-word}
.verdict .vsub{font-size:16px;font-weight:600;max-width:62ch}
.verdict .vsub b{font-weight:800}
.verdict .lnk{color:#000;text-decoration-color:#000}
.verdict .lnk:hover{background:#000;color:var(--vb)}
.verdict .vready{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px;margin:14px 0 2px;padding:0;list-style:none}
.verdict .vready li{background:#fff;color:#000;border:var(--bw) solid #000;border-radius:var(--r-sm);box-shadow:2px 2px 0 #000;padding:6px 10px;display:flex;flex-direction:column;min-width:0}
.verdict .vready li b{font-size:17px;font-weight:900;font-variation-settings:"wdth" 118;font-variant-numeric:tabular-nums}
.verdict .vready li span{font-size:12.5px;font-weight:600}
.verdict .vready li.fin{background:#000;color:var(--vb)}
.verdict .vnext{margin-top:14px;padding-top:12px;border-top:var(--bw) solid #000;font-weight:600}
.verdict details.more>summary{color:#000;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.verdict details.more .steps2{background:#fff;border:var(--bw) solid #000;border-radius:var(--r-sm);padding:6px 10px}
.verdict details.more .note{color:#000}
.verdict .vstrip{margin-top:16px;background:#fff;color:#000;border:var(--bw) solid #000;border-radius:var(--r-sm);padding:10px 12px 8px}
.verdict .vwarn{margin-top:10px;font-weight:700}
.verdict .vwarn a{color:#000}
.vstrip .rs-h{font-size:14px;font-weight:700}
.vstrip .rs-h .muted{color:#333}
.rs-bar{border:var(--bw) solid #000;border-radius:4px;gap:0;height:34px;background:#000}
.rs-d{opacity:1;border-right:1px solid rgba(0,0,0,.25)}
.rs-d:last-child{border-right:0}
.rs-d.s-ok{background:var(--good)}
.rs-d.s-warn{background:var(--mark)}.rs-d.s-bad{background:var(--crit)}
.rs-d.s-need,.rs-leg i.s-need{background:repeating-linear-gradient(135deg,var(--k3) 0 4px,#fff 4px 7px)}
.rs-d:hover,.rs-d.sel{box-shadow:inset 0 0 0 3px #000}
.rs-d.today{box-shadow:inset 0 -6px 0 #000}
.rs-cut{width:3px;background:#000;opacity:1}
.rs-months,.rs-marks{color:#000}
.rs-marks .in{color:var(--good-ink)}
.rs-info{color:#222;font-size:13.5px}
.rs-leg{color:#222}.rs-leg i{border:1.5px solid #000;border-radius:2px}
.rs-ev li{border-top:1px dashed #999}
.ci{border:var(--bw) solid var(--edge);border-left:10px solid var(--k1)}
.ci.done{border-left-color:var(--good)}
.ci-steps li.ok{color:var(--good-ink)}
.ci-dots span{height:8px;border:1.5px solid var(--edge);border-radius:2px;background:var(--surface)}.ci-dots span.ok{background:var(--good)}.ci-dots span.on{background:var(--mark)}

/* money card, budgets, progress */
.mc-r.bank .mc-l b{font-size:19px;font-weight:900;font-variation-settings:"wdth" 118}
.mc-r.bank.stale{box-shadow:inset 6px 0 0 var(--mark)}
.ifs{background:var(--hover);border:1.5px solid var(--edge);border-radius:var(--r-sm);padding:10px 14px 10px 30px;margin-top:12px}
.pr .pn{font-weight:800}
.prog-h b{font-size:20px;font-weight:900;font-variation-settings:"wdth" 118}

/* calendar, weeks, manage, activity */
.cd{border:var(--bw) solid var(--edge);border-radius:var(--r-sm);background:var(--surface)}
.cd.pad{border:0}
.cd.today{box-shadow:3px 3px 0 var(--edge);border-width:3px}
.cd.sel{outline:3px solid var(--k1);outline-offset:1px}
.cd.u-late,.cd.u-now{background:var(--crit-bg)}.cd.u-soon{background:var(--warn-bg)}
.cn{font-weight:900}
.cdots i{border:1px solid var(--edge);width:8px;height:8px}
.cin{color:var(--good-ink)}.cok{color:var(--good-ink)}.cbal.neg{color:var(--crit-ink)}
.cw{color:var(--ink);font-weight:800}
.wk.cur{--u:var(--k1)}
.wk-k small{color:var(--ink2)}
.msec-h{border-bottom:var(--bw) solid var(--edge);background:var(--hover)}
.mi{border:var(--bw) solid var(--edge);border-radius:var(--r-sm)}
.mi:focus-within{box-shadow:3px 3px 0 var(--mark)}
.cnt{background:var(--ink);color:var(--surface);font-weight:800}
.act.undone .act-l{color:var(--ink3)}

/* mobile */
@media (max-width:720px){
  .nav{background:var(--surface);border-top:var(--bw) solid var(--edge);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:4px}
  .nav a{border:var(--bw) solid transparent;border-radius:var(--r);padding:5px 0;font-size:11.5px;font-weight:800}
  .nav a:hover{background:none;border-color:transparent}
  .nav a[aria-current=page]{background:var(--mark);color:#000;border-color:var(--edge)}
  .fab{background:var(--mark);color:#000;border:var(--bw) solid var(--edge);border-radius:var(--r);box-shadow:4px 4px 0 var(--edge);font-weight:900}
  .verdict{padding:16px 16px 14px;box-shadow:4px 4px 0 var(--edge)}
  .verdict .vready li{flex:1 1 40%}
  dialog{border-radius:var(--r) var(--r) 0 0;box-shadow:none;border-bottom:0}
}
@media (prefers-reduced-motion:reduce){.btn{transition:none}.btn:hover,.btn:active{transform:none}}

/* settings */
.set-sec{border:var(--bw) solid var(--edge);border-radius:var(--r);padding:12px 14px 14px;margin-top:14px;background:var(--surface)}
.set-sec:first-child{margin-top:4px}
.set-sec>h4{margin:0 0 2px!important;font-size:16px!important}
.set-sec>.note:first-of-type{margin:0 0 6px}
.set-sec.danger{border-color:var(--crit)}
.set-sec .g2 .fld{margin-top:8px}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.ver{text-align:center}

/* list buttons stay quiet; yellow is for the main action */
.trow .btn.primary,.row .act .btn.primary{background:var(--surface);color:var(--ink)}

/* Pay screen */

.pay-top{display:grid;gap:12px;margin-bottom:6px}

.wd-d{font-size:11.5px;font-weight:700;color:var(--ink2)}
.wd-n{font-size:20px;font-weight:900;font-variation-settings:"wdth" 118;line-height:1.05}

.glance{padding:14px 14px 8px}

.gc{--u:var(--surface)}.gc[data-act]{cursor:pointer}
.gc-hit{fill:transparent}.gc.today .gc-hit{fill:color-mix(in srgb,var(--k1) 22%,transparent)}
.gc[data-act]:hover .gc-hit,.gc[data-act]:focus .gc-hit{fill:var(--hover)}
.gc-bar{fill:var(--u);stroke:var(--edge);stroke-width:2}
.gc.u-late,.gc.u-now{--u:var(--crit)}.gc.u-soon{--u:#FF8A1F}.gc.u-week{--u:var(--mark)}.gc.u-later{--u:var(--surface)}
.gc-a{font-size:12px;font-weight:900;fill:var(--ink)}.gc-d{font-size:11px;font-weight:700;fill:var(--ink2)}.gc-tt{font-size:10px;font-weight:800;fill:var(--ink)}

.more-row:hover{background:var(--mark);color:#000}
@media (max-width:720px){

/* Manage revamp */
.commit{margin-bottom:14px}
.ctot{font-size:22px;font-weight:900;font-variation-settings:"wdth" 118;font-variant-numeric:tabular-nums}
.cbar{display:flex;height:34px;border:var(--bw) solid var(--edge);border-radius:var(--r-sm);overflow:hidden;background:var(--surface);margin:4px 0 10px}
.cseg{flex:0 0 var(--w);background:var(--c);border-right:var(--bw) solid var(--edge)}
.cseg:last-child{border-right:0}
.cseg.bud,.sw.bud{background:repeating-linear-gradient(135deg,var(--k7) 0 5px,var(--surface) 5px 8px)}
.clegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:6px}
.cl{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;border:1.5px solid var(--edge);border-radius:var(--r-sm);background:var(--surface);padding:6px 10px;cursor:pointer;text-align:left;font-family:var(--f);color:var(--ink)}
.cl:hover{background:var(--hover)}.cl b{font-variant-numeric:tabular-nums}.cl-p{font-size:12px;color:var(--ink2);font-weight:700}.cl-n{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.facts{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.facts li{background:var(--hover);border:1.5px solid var(--edge);border-radius:999px;padding:4px 12px;font-size:13px}
.msec-h{display:flex;flex-wrap:nowrap;align-items:center;gap:10px;padding:10px 12px}

.mh-t{display:flex;align-items:center;gap:8px;flex:1 1 auto;min-width:0}
.mh-t b{font-size:17px;font-weight:900;font-variation-settings:"wdth" 118;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mh-c{flex:none;background:var(--ink);color:var(--surface);border-radius:999px;font-size:12px;font-weight:800;padding:0 8px;line-height:20px}
.mh-a{display:flex;gap:6px;align-items:center;flex:none}
.pen{border:0;background:none;cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;color:var(--ink2)}.pen:hover{background:var(--mark);color:#000}
.ico2{width:32px;padding:0}.btn:disabled{opacity:.3;cursor:default;box-shadow:none;transform:none}
.mrow3{display:grid;grid-template-columns:minmax(0,1fr) auto 38px;gap:6px 12px;align-items:center;padding:10px 12px;border-bottom:1px solid color-mix(in srgb,var(--edge) 22%,transparent)}
.mrow3:last-child{border-bottom:0}
.mrow3 .mn{min-width:0}.mrow3 .mn>.lnk{font-weight:800;font-size:15px}
.mrow3 .mn small{display:block;color:var(--ink2);font-size:12.5px;margin-top:1px}
.mv{display:flex;gap:6px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
.vchip{border:var(--bw) solid var(--edge);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:5px 10px;font-family:var(--f);font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;cursor:text;min-height:34px;white-space:nowrap}
.vchip:hover{background:var(--hover);box-shadow:2px 2px 0 var(--edge)}
.vnote{font-size:12.5px;color:var(--ink2);font-weight:600;padding:0 4px;white-space:nowrap}
.vfix{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
.vedit{display:inline-flex;align-items:center;gap:4px;border:var(--bw) solid var(--edge);border-radius:var(--r-sm);padding:0 8px;background:var(--surface);box-shadow:3px 3px 0 var(--mark)}

.vedit input.vin[inputmode=numeric]{width:36px}
.lprog{height:10px;border:1.5px solid var(--edge);border-radius:3px;background:var(--surface);margin:5px 0 2px;max-width:240px;overflow:hidden}
.lprog i{display:block;height:100%;width:var(--p);background:var(--c,var(--k1))}
.stm{display:inline-block;margin-top:4px;margin-right:6px;font-size:12px;font-weight:700;border:1.5px solid var(--edge);border-radius:999px;padding:0 8px;background:var(--surface)}
.stm.ok{background:var(--good-bg)}.stm.est{border-style:dashed}.stm.cash{background:var(--warn-bg)}
.fresh{display:block;width:120px;height:7px;border:1.5px solid var(--edge);border-radius:3px;margin-top:5px;overflow:hidden;background:var(--surface)}
.fresh i{display:block;height:100%;width:var(--p);background:var(--good)}
.seg.mini button{padding:3px 9px;font-size:12.5px}
.newcat-b{display:flex;gap:10px;align-items:baseline;width:100%;margin:0 0 12px;padding:12px 14px;border:var(--bw) dashed var(--edge);border-radius:var(--r);background:transparent;color:var(--ink);font-family:var(--f);font-weight:800;font-size:15px;cursor:pointer;text-align:left}
.newcat-b span{font-weight:500;font-size:13px;color:var(--ink2)}.newcat-b:hover{background:var(--hover)}
@media (max-width:640px){
  .mrow3{grid-template-columns:minmax(0,1fr) 38px;grid-template-areas:'n m' 'v v'}
  .mrow3 .mn{grid-area:n}.mrow3 .mv{grid-area:v;justify-content:flex-start}.mrow3>.rmb,.mrow3>span:last-child{grid-area:m}
  .msec-h{flex-wrap:wrap}.mh-a{margin-left:auto}

/* Home charts */
.io{margin:14px 0 4px;padding:12px;border:var(--bw) solid var(--edge);border-radius:var(--r-sm);background:var(--bg)}
.io-r{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;margin-bottom:8px}
.io-l{display:flex;flex-direction:column;font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.2}
.io-l b{font-size:16px;color:var(--ink);font-weight:900;font-variation-settings:"wdth" 112;font-variant-numeric:tabular-nums}
.io-bar{display:flex;height:34px;border:var(--bw) solid var(--edge);border-radius:4px;background:var(--surface);overflow:hidden}
.io-s{flex:0 0 var(--w);min-width:3px;border:0;border-right:var(--bw) solid var(--edge);background:var(--c);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font:800 12.5px var(--f);color:#000}
.io-s:last-child{border-right:0}
.io-s.hatch,.io-k i.hatch{background:repeating-linear-gradient(135deg,var(--c) 0 5px,var(--surface) 5px 9px)}
.io-s:hover{filter:brightness(1.08);box-shadow:inset 0 0 0 3px #000}
.io-s span{background:var(--surface);border:1.5px solid #000;border-radius:3px;padding:0 4px;color:#000}
.io-k{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;font-weight:600;color:var(--ink2);margin-top:2px}

.io-g{margin:8px 0 0;font-weight:800;font-size:14px}
.prog2 .prog-h{margin-bottom:12px}
.rings{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.rc{display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px;padding:12px 8px;border:var(--bw) solid var(--edge);border-radius:var(--r);text-decoration:none;color:var(--ink);background:var(--surface)}
.rc:hover{background:var(--hover);box-shadow:3px 3px 0 var(--edge);transform:translate(-1px,-1px)}
.rc b{font-size:14.5px;font-weight:900;margin-top:4px}.rc span{font-weight:800;font-variant-numeric:tabular-nums}.rc small{color:var(--ink2);font-size:12px}
.ring{width:96px;height:96px}
.rg-t{fill:none;stroke:var(--grid);stroke-width:14}
.rg-v{fill:none;stroke:var(--c);stroke-width:14}
.rg-o{fill:none;stroke:var(--edge);stroke-width:2}
.rg-x{font:900 17px var(--f);fill:var(--ink);font-variation-settings:"wdth" 112}
@media (max-width:640px){.io-r{grid-template-columns:1fr;gap:4px}.io-l{flex-direction:row;justify-content:space-between;align-items:baseline}.rings{grid-template-columns:1fr 1fr}.ring{width:84px;height:84px}}

/* Money */
.atiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.atile{background:var(--surface);border:var(--bw) solid var(--edge);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.atile.stale{box-shadow:inset 0 8px 0 var(--mark)}
.at-h{display:flex;justify-content:space-between;align-items:center}.at-h .lnk{font-weight:800}
.at-b .vchip{font-size:24px;font-weight:900;font-variation-settings:"wdth" 118;padding:4px 10px;min-height:44px}
.atile .fresh{width:100%}
.atile small{color:var(--ink2);font-size:12.5px;font-weight:600}
.itl{position:relative;height:92px;margin:4px 8px 6px}
.itl-line{position:absolute;left:0;right:0;top:46px;height:0;border-top:var(--bw) solid var(--edge)}
.itl-t{position:absolute;top:72px;font-size:12px;font-weight:700;color:var(--ink2);white-space:nowrap}
.itl-m{position:absolute;top:calc(46px - var(--s)/2 + (var(--row) - .5)*0px);left:0;width:var(--s);height:var(--s);transform:translateX(-50%);border-radius:50%;border:var(--bw) solid var(--edge);background:var(--k4);cursor:pointer;padding:0;box-shadow:2px 2px 0 var(--edge)}
.itl-m.maybe{background:repeating-linear-gradient(135deg,var(--k4) 0 4px,var(--surface) 4px 7px)}
.itl-m.late{outline:3px solid var(--crit);outline-offset:1px}
.itl-m span{position:absolute;left:50%;transform:translateX(-50%);top:calc(-18px - var(--row)*0px);white-space:nowrap;font:800 12px var(--f);color:var(--ink)}
.incrow{display:grid;grid-template-columns:50px minmax(0,1fr) auto;gap:6px 12px;align-items:start;padding:12px 14px;border-top:1px solid color-mix(in srgb,var(--edge) 22%,transparent)}
.incrow .a{font-weight:800}.incrow .b{font-size:12.5px;color:var(--ink2)}
.wi{margin-top:8px;display:grid;gap:4px;max-width:440px}
.wi-r{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:12.5px;font-weight:700}
.wi-b{height:12px;border:1.5px solid var(--edge);border-radius:3px;background:var(--surface);overflow:hidden}.wi-b i{display:block;height:100%;width:var(--w);background:var(--crit)}
.okc{color:var(--good-ink)}
@media (max-width:640px){.incrow{grid-template-columns:44px minmax(0,1fr)}.incrow .acts{grid-column:2;justify-content:flex-start}.atiles{grid-template-columns:1fr 1fr}.at-b .vchip{font-size:19px}.wi-r{grid-template-columns:84px 1fr auto}}
/* Plan: calendar heat, EMIs */
.cd.heat{background:color-mix(in srgb,var(--k1) var(--h),var(--surface))}
.debt{margin-top:0}
.dfree{border:var(--bw) solid var(--edge);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);margin-bottom:12px}
.df-h{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;font-weight:700}.df-h b{font-size:22px;font-weight:900;font-variation-settings:"wdth" 118}
.df-bar{height:22px;border:var(--bw) solid var(--edge);border-radius:4px;background:repeating-linear-gradient(135deg,var(--surface) 0 6px,var(--grid) 6px 9px);margin:8px 0 6px;overflow:hidden}
.df-bar i{display:block;height:100%;width:var(--w);background:var(--good);border-right:var(--bw) solid var(--edge)}

.ax2{font-size:12px;font-weight:700;fill:var(--ink2)}.ax2.strong{fill:var(--ink);font-weight:900;font-size:14px}
.closes{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px;margin-top:10px}
.clz{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;border:var(--bw) solid var(--edge);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);padding:8px 10px;cursor:pointer;font-family:var(--f);box-shadow:2px 2px 0 var(--edge)}
.clz:hover{background:var(--hover)}.clz b{font-size:15px;font-weight:900}.clz span{font-size:12.5px;font-weight:600}

/* motion */
@keyframes slL{from{transform:translateX(26px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slR{from{transform:translateX(-26px);opacity:.3}to{transform:none;opacity:1}}
.motion #view.sl-l{animation:slL .26s cubic-bezier(.2,.9,.3,1.2)}
.motion #view.sl-r{animation:slR .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes fuse{from{transform:scaleY(.15);opacity:0}to{transform:none;opacity:1}}
.motion #view:not(.noanim) .verdict.fuse .rs-d{animation:fuse .28s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*14ms)}
@keyframes sheetUp{from{transform:translateY(40%);opacity:.4}70%{transform:translateY(-6px)}to{transform:none;opacity:1}}
@keyframes popIn{from{transform:scale(.94) translate(6px,6px);opacity:.3}70%{transform:scale(1.01)}to{transform:none;opacity:1}}
.motion dialog[open]{animation:popIn .24s cubic-bezier(.2,.9,.3,1.2)}
@media (max-width:720px){.motion dialog[open]{animation:sheetUp .3s cubic-bezier(.2,.9,.3,1.15)}}
.motion .io .io-s{transition:flex-basis .7s cubic-bezier(.2,.9,.3,1.05)}
.motion #view:not(.noanim) .io:not(.in) .io-s{flex-basis:0}
.rg-v{stroke-dasharray:var(--C);stroke-dashoffset:var(--off)}
.motion .rings .rg-v{transition:stroke-dashoffset .9s cubic-bezier(.2,.8,.2,1)}
.motion #view:not(.noanim) .rings:not(.in) .rg-v{stroke-dashoffset:var(--C)}
.motion .cbar .cseg{transition:flex-basis .7s cubic-bezier(.2,.9,.3,1.05);transition-delay:calc(var(--i)*80ms)}
.motion #view:not(.noanim) .cbar:not(.in) .cseg{flex-basis:0}
.motion .dfree .df-bar i{transition:width 1s cubic-bezier(.2,.8,.2,1)}
.motion #view:not(.noanim) .dfree:not(.in) .df-bar i{width:0}
.gc-bar{transform-box:fill-box;transform-origin:50% 100%}
.motion .glance .gc-bar{transition:transform .5s cubic-bezier(.2,.9,.3,1.3);transition-delay:calc(var(--i)*18ms)}
.motion #view:not(.noanim) .glance:not(.in) .gc-bar{transform:scaleY(0)}
.emi-l{stroke-dasharray:1;stroke-dashoffset:0}
.motion .debt .emi-l{transition:stroke-dashoffset 1.2s ease-out}
.motion #view:not(.noanim) .debt:not(.in) .emi-l{stroke-dashoffset:1}
.motion .debt .dm{transition:opacity .3s;transition-delay:calc(.5s + var(--i)*25ms)}
.motion #view:not(.noanim) .debt:not(.in) .dm{opacity:0}
.motion .wstrip .wd{transition:transform .35s cubic-bezier(.2,.9,.3,1.3),opacity .3s}
.motion #view:not(.noanim) .wstrip:not(.in) .wd{transform:translateY(12px);opacity:0}
.motion .bmeter i,.motion .lprog i,.motion .fresh i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.motion #view:not(.noanim) .bmeter:not(.in) i,.motion #view:not(.noanim) .lprog:not(.in) i{width:0!important}
.motion #view:not(.noanim) .atiles:not(.in) .fresh i{width:0!important}
.motion .itl .itl-m{transition:transform .4s cubic-bezier(.2,.9,.3,1.4)}

function needSteps(days,buf){

      return `<div class="tday ${g.k==='late'?'u-late':urg(d)}"><div class="tday-h"><span class="dl"><b>${L.t}</b>${L.s?` <span>${L.s}</span>`:''}</span><span class="dt2">${g.xs.length>1?`${g.xs.length} bills · `:''}<b>${money(sum(g.xs,x=>x.rem))}</b>${g.xs.length>1&&g.k!=='any'?` <button class="btn sm ghost payall" data-act="payAll" data-k="${g.k}">Pay all</button>`:''}</span></div>${g.xs.map(trow).join('')}</div>`}).join('');

function ring(p,c,label){const R=34,C=2*Math.PI*R,v=Math.max(0,Math.min(1,p));

  const s=summary(VM);
  if(embed)U.view='cat';
  let h=embed?'':`<div class="toolbar"><div class="seg" role="group" aria-label="View">
      <button data-act="view" data-k="cat" aria-pressed="${U.view==='cat'}">By category</button>

  const ear=VM>=CUR&&!embed?earlier():[];
  if(ear.length)h+=`<div class="grp"><div class="grp-h" style="cursor:default"><span class="sw" style="--c:var(--crit)"></span><span class="gn">Unpaid from earlier months</span><span class="ga">${money(sum(ear,x=>x.rem))}</span><span></span></div><div class="list">${ear.map(x=>rowHTML(x,{sw:1,showMonth:1})).join('')}</div></div>`;
  const fold=P=>P.length?`<details class="paidfold"><summary>✓ ${P.length} paid · ${money(sum(P,x=>x.amount))}</summary><div class="list">${P.map(x=>rowHTML(x,{sw:U.view==='date'})).join('')}</div></details>`:'';
  if(U.view==='cat'){
    S.cats.forEach(c=>{

      const nd=[];
      S.items.filter(i=>i.cat===c.id).forEach(it=>{
        const o=ov(VM,it.id);
        if(o&&o.skip&&occursIn(it,VM)){nd.push(`<span>${esc(it.name)} · skipped in ${fmS(VM)} <button class="lnk" data-act="unskip" data-id="${it.id}" data-m="${VM}">Undo</button></span>`);return}

        const n=nextOcc(it,VM);if(n){const y=inst(it,n);nd.push(`<span class="nx"><span>${esc(it.name)}${it.owner&&it.owner!=='Me'?` (${esc(it.owner)})`:''}</span><span class="muted">${y.due?fd(y.due):fm(n)}</span><b>${y.confirmed?'':'about '}${money(y.amount)}</b>${y.confirmed?'<span></span>':'<span class="est">Estimate</span>'}</span>`)}
      });

        <button class="grp-h" data-act="collapse" data-id="${c.id}" aria-expanded="${isOpen}"><span class="sw"></span><span class="gn">${esc(c.name)}</span>

        <div class="list">${open.length?open.map(x=>rowHTML(x)).join(''):all.length?'':'<div class="empty">Nothing due this month.</div>'}</div>${fold(paid)}
        <div class="gfoot"><div class="nd">${nd.length?`<b class="small">Coming up in later months</b>${nd.join('')}`:''}</div>

  const pos=d=>Math.max(0,Math.min(100,between(TODAY,d<TODAY?TODAY:d)/span*100));
  const mx=Math.max(...pend.map(p=>+p.f.amount||0),1);
  return `<div class="itl"><div class="itl-line"></div><span class="itl-t" style="left:0">Today</span><span class="itl-t" style="left:100%;transform:translateX(-100%)">${fd(end)}</span>
    ${pend.map(({f,n},i)=>`<button class="itl-m${f.sure?'':' maybe'}${n.d<TODAY?' late':''}" style="left:${pos(n.d)}%;--s:${14+Math.sqrt((+f.amount||0)/mx)*20}px;--row:${i%2}" data-act="editInc" data-id="${f.id}" title="${esc(f.name)} ${esc(money(f.amount))}, ${esc(fd(n.d))}"><span>${esc(kShort(+f.amount||0))}</span></button>`).join('')}</div>`;

function whatIf(f){
  const ctx=planCtx();if(!ctx.sc)return '';const sc=ctx.sc,end=ctx.showNext?ctx.B.en:ctx.preEnd;
  const key=incOcc(end).find(o=>o.f===f);if(!key)return '';
  const need=x=>ctx.showNext?x.total:x.shortPre;

function loanFuture(){
  const L=S.items.filter(i=>kindOf(i)==='loan'&&i.until&&i.until>=CUR);if(!L.length)return null;
  const last=L.map(l=>l.until).sort().pop(),ms=[];
  for(let m=CUR;m<=addMonths(last,1);m=addMonths(m,1))ms.push({m,v:sum(L.filter(l=>occursIn(l,m)),l=>l.amount),ends:L.filter(l=>l.until===addMonths(m,-1))});
  const all=S.items.filter(i=>kindOf(i)==='loan'&&i.from&&i.until);
  const totAll=sum(all,l=>(mIdx(l.until)-mIdx(l.from)+1)*l.amount);
  const paid=sum(all,l=>{const n=Math.max(0,Math.min(mIdx(l.until)-mIdx(l.from)+1,mIdx(CUR)-mIdx(l.from)));const x=occursIn(l,CUR)?inst(l,CUR):null;return n*l.amount+(x?x.paid:0)});

}

function loanRows(){
  return S.items.filter(it=>kindOf(it)==='loan'&&(!it.until||it.until>=VM)&&(!it.from||it.from<=addMonths(VM,24))).map(it=>{

}

function niceTicks(min,max,n){
  const span=(max-min)||1,raw=span/n,p=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/p;
  const st=(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  const a=Math.floor(min/st)*st,b=Math.ceil(max/st)*st,o=[];
  for(let v=a;v<=b+st/2;v+=st)o.push(Math.round(v));return o;
}

function reconcile(accIds,change){ // change = new total minus old total for these accounts
  change=r2(change||0);if(Math.abs(change)<1)return;
  const inAcc=id=>accIds.includes(id),down=change<0,amt=Math.abs(change);
  const arr=down?[]:incOcc(addDays(TODAY,0)).filter(o=>inAcc(o.f.account)&&(o.late||o.d===TODAY));
  const bills=[];if(down)for(let m=S.startMonth;m<=addMonths(CUR,1);m=addMonths(m,1))monthList(m).forEach(x=>{if(x.rem>0&&((x.due&&x.due<=addDays(TODAY,3))||(!x.due&&m<CUR)))bills.push(x)});
  bills.sort(byDue);
  if(!arr.length&&!bills.length)return;
  const j0=snap(),nm=esc(accIds.map(id=>(acct(id)||{}).name).filter(Boolean).join(', '));
  let b=down
    ?`<p style="margin-top:0">Your ${nm} balance went <b>down by ${money(amt)}</b> since you last entered it.</p><p class="muted">If that was because you already paid some of these bills (for example from your bank app), tick them. They will be marked paid without taking the money off again. If you have not paid them yet, tap "Not paid yet".</p>`
    :`<p style="margin-top:0">Your ${nm} balance went <b>up by ${money(amt)}</b> since you last entered it.</p><p class="muted">If that is because this money arrived, tick it. It will be marked as received without adding it again.</p>`;
  const list=down?bills.map((x,i)=>({k:'bill_'+i,a:x.rem,h:`<b>${esc(x.it.name)}</b> ${money(x.rem)}<br><span class="small muted">${x.due?`due ${fdw(x.due)}`:`from ${fmS(x.m)}`}</span>`}))
    :arr.map((o,i)=>({k:'in_'+i,a:o.amt,h:`<b>${esc(o.f.name)}</b> ${money(o.amt)}<br><span class="small muted">expected ${fd(o.f.type==='monthly'?`${o.m}-${pad(o.f.day||1)}`:o.f.date)}</span>`}));
  b+=list.map(l=>`<label class="chk"><input type="checkbox" name="${l.k}" data-a="${l.a}"><span>${l.h}</span></label>`).join('');
  b+=`<p class="hint" id="recTot">Ticked ${money(0)} of the ${money(amt)} ${down?'drop':'rise'}.</p>`;
  const f=openDlg(down?'Did you already pay any of these?':'Did this money already arrive?',b,`<button type="button" class="btn" data-close>${down?'Not paid yet':'Not yet'}</button><button class="btn primary">${down?'Mark as paid':'Mark as received'}</button>`,fdata=>{
    let n=0;
    arr.forEach((o,i)=>{if(!fdata.get('in_'+i))return;n++;const rr={amt:o.amt,date:TODAY,acc:o.f.account,at:Date.now(),added:false};
      if(o.f.type==='monthly'){o.f.rec=o.f.rec||{};o.f.rec[o.m]=rr}else{o.f.received=true;o.f.recAmt=o.amt;o.f.recOn=TODAY;o.f.recAcc=o.f.account;o.f.recAt=rr.at;o.f.recAdded=false}});
    bills.forEach((x,i)=>{if(!fdata.get('bill_'+i))return;n++;const o=ov(x.m,x.it.id,true);o.pays=o.pays||[];o.pays.push({id:uid(),date:TODAY,amount:x.rem,acc:'',note:'Already in bank balance',at:Date.now()});if(x.it.mode==='used')o.on=true});
    if(n)setTimeout(()=>toast(`${n} item${n>1?'s':''} marked, balance unchanged`,()=>restore(j0)),0);
  });
  f.addEventListener('change',()=>{const t=sum([...f.querySelectorAll('input[type=checkbox]:checked')],c=>+c.dataset.a);const e=$('#recTot');
    e.innerHTML=`Ticked <b>${money(t)}</b> of the ${money(amt)} ${down?'drop':'rise'}.${Math.abs(t-amt)<1?' That matches.':t>amt+1?' That is more than the change, so something may not be paid yet.':''}`});
}

function cashPlace(f){

  return{m,card:card.id};
}
function cashClear(f){
  const p=f.cashAt;if(!p)return;const o=ov(p.m,p.card);
  if(o&&o.cashInc===f.id){delete o.cash;delete o.cashInc;if(o.cashDue){delete o.due;delete o.cashDue}
    if(o.cashOn){if(!o.confirmed&&!(o.pays&&o.pays.length))delete o.on;delete o.cashOn}
    if(!Object.keys(o).length)delete S.months[p.m][p.card]}

}

/* ============ round 1: runway strip, check-in, pay all, statements, manage ============ */
function runwayStrip(ctx){
  const {sc,B,showNext,preEnd,pf}=ctx;if(!sc)return '';
  const end=showNext?B.en:preEnd,days=sc.days.filter(d=>d.d<=end);if(days.length<2)return '';
  const buf=sc.buf,cls=d=>d.bal<buf&&d.d>=B.st?'s-need':d.bal<0?'s-bad':d.bal<buf?'s-warn':'s-ok';
  const bad=days.find(d=>d.bal<buf),n=days.length,pct=i=>(i/(n-1))*100;
  const head=!bad?`<b>Covered until ${fdw(end)}</b>${showNext?'':` <span class="muted">next month's bills show here from ${fd(pf)}</span>`}`:bad.d>=B.st&&bad.d>TODAY?`<b>Covered until ${fdw(addDays(bad.d,-1))}</b> <span class="muted">then next month's bills need ${N$(sc.bundleNeed)} more</span>`
    :`<b class="neg">Short from ${fdw(bad.d)}</b> <span class="muted">by ${N$(buf-bad.bal)} that day</span>`;
  let months='';days.forEach((d,i)=>{if(i===0||d.d.slice(8)==='01')months+=`<span style="left:${pct(i)}%">${esc(parse(d.d).toLocaleDateString('en-IN',{month:'short'}))}</span>`});
  let marks='';days.forEach((d,i)=>{const inn=sum(d.ev.filter(e=>e.a>0),e=>e.a),out=-sum(d.ev.filter(e=>e.a<0),e=>e.a);
    if(inn>=50000)marks+=`<span class="mk in" style="left:${pct(i)}%" title="${esc(fd(d.d))}: +${money(inn)}">▲</span>`;
    else if(out>=50000)marks+=`<span class="mk out" style="left:${pct(i)}%" title="${esc(fd(d.d))}: −${money(out)}">▼</span>`});
  const bi=days.findIndex(d=>d.d===B.st);
  return `<div class="vstrip"><div class="rs-h"><span>Your balance, day by day</span><span class="muted small">today to ${fd(end)}</span></div>
    <div class="rs-months">${months}</div>
    <div class="rs-bar" role="group" aria-label="Balance by day">${days.map((d,i)=>`<button style="--i:${i}" class="rs-d ${cls(d)}${d.d===TODAY?' today':''}" data-act="rsDay" data-d="${d.d}" aria-label="${esc(fd(d.d))}, balance ${esc(money(d.bal))}"></button>`).join('')}${bi>0?`<span class="rs-cut" style="left:${pct(bi)}%" title="Next month's bills start"></span>`:''}</div>
    <div class="rs-marks">${marks}</div>
    <div class="rs-info" id="rsInfo">Tap a day to see your balance and what happens that day. <span class="rs-leg"><span><i class="s-ok"></i>covered</span>${buf>0?'<span><i class="s-warn"></i>below buffer</span>':''}<span><i class="s-bad"></i>short</span>${showNext?`<span><i class="s-need"></i>needs the money you arrange</span>`:''}<span><b class="in">▲</b> money in</span><span>▼ big bill</span></span></div></div>`;

/* ============ motion: only to show what changed; off with Reduce Motion ============ */
const MOTION=(()=>{try{return !matchMedia('(prefers-reduced-motion: reduce)').matches&&!navigator.webdriver}catch(e){return false}})(); // automated test browsers get the still version
if(MOTION)document.documentElement.classList.add('motion');
const Mo={route:'',vVal:null,vBg:'',first:true,obs:null};
const NAVORD=['home','pay','money','plan','manage'];
function countTo(el,from,to,ms){
  if(!MOTION||!el||from===to)return;
  const pre=el.textContent.match(/^[^\d-]*/)[0],t0=performance.now(),dec=Math.abs(to%1)>0;
  const f=v=>pre+Math.round(v).toLocaleString('en-IN');
  const step=t=>{const k=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-k,3);el.textContent=f(from+(to-from)*e);if(k<1)requestAnimationFrame(step);else el.textContent=pre+(dec?to.toLocaleString('en-IN',{maximumFractionDigits:2}):Math.round(to).toLocaleString('en-IN'))};
  el.textContent=f(from);requestAnimationFrame(step);
}
const numOf=t=>{const m=(t||'').replace(/,/g,'').match(/-?\d+(\.\d+)?/);return m?+m[0]:null};
function afterRender(r){
  const newRoute=r!==Mo.route;
  // slide between tabs
  if(MOTION&&newRoute&&Mo.route){const a=NAVORD.indexOf(Mo.route==='dues'?'pay':Mo.route),b=NAVORD.indexOf(r==='dues'?'pay':r);
    view.classList.remove('sl-l','sl-r');void view.offsetWidth;view.classList.add(b>=a?'sl-l':'sl-r')}
  // status block: count up the first time, roll + colour morph when it changes
  const v=$('.verdict .vbig'),vb=$('.verdict');
  if(v&&vb){const val=numOf(v.textContent),bg=getComputedStyle(vb).backgroundColor;
    if(Mo.vVal==null){if(Mo.first){countTo(v,0,val,750);vb.classList.add('fuse')}}
    else if(val!==Mo.vVal){countTo(v,Mo.vVal,val,600);if(MOTION&&Mo.vBg&&Mo.vBg!==bg){vb.style.transition='none';vb.style.backgroundColor=Mo.vBg;void vb.offsetWidth;vb.style.transition='background-color .5s';vb.style.backgroundColor='';setTimeout(()=>{vb.style.transition=''},600)}}
    else if(newRoute&&MOTION)vb.classList.add('fuse');
    Mo.vVal=val;Mo.vBg=bg}
  // charts draw once per visit to a screen
  const sel='.io,.rings,.cbar,.dfree,.glance,.debt,.wstrip,.bmeter,.lprog,.atiles,.itl';
  if(Mo.obs)Mo.obs.disconnect();
  if(!MOTION||!newRoute){$$(sel).forEach(e=>e.classList.add('in'))}
  else{Mo.obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');Mo.obs.unobserve(en.target)}}),{threshold:.2});$$(sel).forEach(e=>Mo.obs.observe(e))}
